  <!-- Firebase：讀取後台編輯過的資料（Firestore overrides），公開網站僅需「讀取」權限 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // TODO：請將以下設定值換成你自己 Firebase 專案的設定（Firebase Console → 專案設定 → 一般 → 你的應用程式）
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let cachedOverrides = null;

    async function fetchOverrides() {
      if (cachedOverrides) return cachedOverrides;
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const snap = await getDocs(collection(db, 'overrides'));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        cachedOverrides = out;
        return out;
      } catch (err) {
        console.warn('讀取後台編輯資料失敗，僅顯示原始候選人資料。', err);
        cachedOverrides = {};
        return {};
      }
    }

    // 將 overrides 套用到一份剛載入的 topology：依 geometry 的 properties.id（縣市/鄉鎮市區/村里代碼）比對
    function applyOverridesToTopology(topo, overrides) {
      if (!overrides || Object.keys(overrides).length === 0) return topo;
      const objKey = Object.keys(topo.objects)[0];
      topo.objects[objKey].geometries.forEach(g => {
        const o = overrides[g.properties.id];
        if (!o) return;
        if (o.candidates) g.properties.candidates = o.candidates;
        if (o.councilors) g.properties.councilors = o.councilors;
        if (o.representatives) g.properties.representatives = o.representatives;
        if (o.voters !== undefined) g.properties.voters = o.voters;
        if (o.quota !== undefined) g.properties.quota = o.quota;
      });
      return topo;
    }

    window.__electionOverrides = { fetchOverrides, applyOverridesToTopology };
  </script>

    let countiesTopoCache = null;    // 縣市 topology（含候選人資料），開站時載入一次
    let townsCache = {};             // countyCode -> topology
    let villagesCache = {};          // townCode -> topology

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('載入失敗: ' + url);
      return res.json();
    }

    function topoToFeatures(topo) {
      const objKey = Object.keys(topo.objects)[0];
      return topojson.feature(topo, topo.objects[objKey]);
    }

    const LEVEL_COLORS = { county: '#FF5722', town: '#2563EB', village: '#22C55E' };

    function styleForLevel(level) {
      return { weight: 1.5, color: '#141517', fillColor: LEVEL_COLORS[level], fillOpacity: 0.12 };
    }

    function clearCurrentLayer() {
      if (currentLayer) { map.removeLayer(currentLayer); currentLayer = null; }
    }

    // 4. 三級行政區圖層渲染（點擊即鑽研到下一層）
    async function renderCountyLayer() {
      clearCurrentLayer();
      currentCounty = null;
      currentTown = null;
      updateBreadcrumb();

      if (!countiesTopoCache) {
        let topo = await fetchJSON('./data/counties.json');
        const overrides = await window.__electionOverrides.fetchOverrides();
        topo = window.__electionOverrides.applyOverridesToTopology(topo, overrides);
        countiesTopoCache = topo;
        populateCitySelect(topo);
      }

      const fc = topoToFeatures(countiesTopoCache);
      currentLayer = L.geoJson(fc, {
        style: () => styleForLevel('county'),
        onEachFeature: (feature, layer) => {
          layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.32 }));
          layer.on('mouseout', () => layer.setStyle({ fillOpacity: 0.12 }));
          layer.on('click', () => onCountyClick(feature, layer));
        }
      }).addTo(map);

      map.flyTo([23.8, 120.9], 8, { duration: 1 });
    }

    async function onCountyClick(feature, layer) {
      const code = feature.properties.id;
      const name = feature.properties.name;
      currentCounty = { code, name, feature };
      selectCity.value = name;
      onCityChangeFromCode(code);
    }

    async function renderTownLayer(countyCode) {
      clearCurrentLayer();
      currentTown = null;

      if (!townsCache[countyCode]) {
        let topo = await fetchJSON(`./data/towns/towns-${countyCode}.json`);
        const overrides = await window.__electionOverrides.fetchOverrides();
        topo = window.__electionOverrides.applyOverridesToTopology(topo, overrides);
        townsCache[countyCode] = topo;
      }
      const topo = townsCache[countyCode];
      const fc = topoToFeatures(topo);

      currentLayer = L.geoJson(fc, {
        style: () => styleForLevel('town'),
        onEachFeature: (feature, layer) => {
          layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.32 }));
          layer.on('mouseout', () => layer.setStyle({ fillOpacity: 0.12 }));
          layer.on('click', () => onTownClick(feature, layer));
        }
      }).addTo(map);

      populateDistrictSelect(topo);
      map.flyTo(currentLayer.getBounds().getCenter(), 11, { duration: 1 });
      try { map.fitBounds(currentLayer.getBounds(), { padding: [40, 40] }); } catch (e) {}
    }

    async function onTownClick(feature, layer) {
      const code = feature.properties.id;
      const name = feature.properties.name;
      currentTown = { code, name, feature };
      selectDistrict.value = name;
      onDistrictChangeFromCode(code);
    }

    async function renderVillageLayer(townCode) {
      clearCurrentLayer();

      if (!villagesCache[townCode]) {
        let topo = await fetchJSON(`./data/villages/villages-${townCode}.json`);
        const overrides = await window.__electionOverrides.fetchOverrides();
        topo = window.__electionOverrides.applyOverridesToTopology(topo, overrides);
        villagesCache[townCode] = topo;
      }
      const topo = villagesCache[townCode];
      const fc = topoToFeatures(topo);

      currentLayer = L.geoJson(fc, {
        style: () => styleForLevel('village'),
        onEachFeature: (feature, layer) => {
          layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.35 }));
          layer.on('mouseout', () => layer.setStyle({ fillOpacity: 0.14 }));
          layer.on('click', () => onVillageClick(feature, layer));
        }
      }).addTo(map);

      populateVillageSelect(topo);
      try { map.fitBounds(currentLayer.getBounds(), { padding: [60, 60] }); } catch (e) {}
    }

    function onVillageClick(feature, layer) {
      const name = feature.properties.name;
      selectVillage.value = name;
      const villRole = name.endsWith('里') ? '里長選舉' : '村長選舉';
      renderDrawer(
        `${currentCounty.name} > ${currentTown.name} > ${name}`,
        `${name} ${villRole}`,
        '最基層村里',
        feature.properties.voters,
        feature.properties.quota || '1 席',
        feature.properties.candidates,
        null
      );
    }

    // 5. 下拉選單（與地圖點擊互為捷徑：資料來源相同，都是逐層 fetch）
    function populateCitySelect(topo) {
      selectCity.innerHTML = '<option value="">選擇縣市 (22)</option>';
      const fc = topoToFeatures(topo);
      fc.features
        .slice()
        .sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.name;
          opt.dataset.code = f.properties.id;
          opt.textContent = `${f.properties.name} (${f.properties.category})`;
          selectCity.appendChild(opt);
        });
    }

    function populateDistrictSelect(topo) {
      selectDistrict.innerHTML = '<option value="">選擇鄉鎮市區</option>';
      selectDistrict.disabled = false;
      selectVillage.innerHTML = '<option value="">選擇村里</option>';
      selectVillage.disabled = true;
      const fc = topoToFeatures(topo);
      fc.features
        .slice()
        .sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.name;
          opt.dataset.code = f.properties.id;
          opt.textContent = f.properties.name;
          selectDistrict.appendChild(opt);
        });
    }

    function populateVillageSelect(topo) {
      selectVillage.innerHTML = '<option value="">選擇村里</option>';
      selectVillage.disabled = false;
      const fc = topoToFeatures(topo);
      fc.features
        .slice()
        .sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.name;
          opt.textContent = f.properties.name;
          selectVillage.appendChild(opt);
        });
    }

    async function onCityChangeFromCode(code) {
      const fc = topoToFeatures(countiesTopoCache);
      const feature = fc.features.find(f => f.properties.id === code);
      if (!feature) return;
      currentCounty = { code, name: feature.properties.name, feature };
      updateBreadcrumb();
      renderDrawer(feature.properties.name, `${feature.properties.name}首長選舉`, feature.properties.category,
        feature.properties.voters, feature.properties.quota, feature.properties.candidates,
        { label: '議員候選人（依選舉區）', blocks: feature.properties.councilors });
      await renderTownLayer(code);
    }

    async function onDistrictChangeFromCode(code) {
      const fc = topoToFeatures(townsCache[currentCounty.code]);
      const feature = fc.features.find(f => f.properties.id === code);
      if (!feature) return;
      currentTown = { code, name: feature.properties.name, feature };
      updateBreadcrumb();
      const distTag = feature.properties.isIndigenousDistrict ? '山地原住民區' : '行政區轄區';
      const repLabel = feature.properties.isIndigenousDistrict ? '區民代表候選人（依選舉區）' : '鄉鎮市民代表候選人（依選舉區）';
      const distCandidates = (feature.properties.candidates && feature.properties.candidates.length > 0)
        ? feature.properties.candidates
        : currentCounty.feature.properties.candidates;
      renderDrawer(`${currentCounty.name} > ${feature.properties.name}`, `${feature.properties.name} 公職名冊`, distTag,
        feature.properties.voters, feature.properties.quota, distCandidates,
        { label: repLabel, blocks: feature.properties.representatives });
      await renderVillageLayer(code);
    }

    selectCity.addEventListener('change', () => {
      const opt = selectCity.selectedOptions[0];
      if (!opt || !opt.value) { resetAllFilters(); return; }
      onCityChangeFromCode(opt.dataset.code);
    });
    selectDistrict.addEventListener('change', () => {
      const opt = selectDistrict.selectedOptions[0];
      if (!opt || !opt.value) { renderTownLayer(currentCounty.code); return; }
      onDistrictChangeFromCode(opt.dataset.code);
    });
    selectVillage.addEventListener('change', () => {
      const name = selectVillage.value;
      if (!name) return;
      const fc = topoToFeatures(villagesCache[currentTown.code]);
      const feature = fc.features.find(f => f.properties.name === name);
      if (feature) onVillageClick(feature, null);
    });

    // 6. 麵包屑導覽
    function updateBreadcrumb() {
      const countyWrap = document.getElementById('breadcrumb-county-wrap');
      const townWrap = document.getElementById('breadcrumb-town-wrap');
      if (currentCounty) {
        countyWrap.classList.remove('hidden');
        countyWrap.classList.add('flex');
        document.getElementById('breadcrumb-county').textContent = currentCounty.name;
      } else {
        countyWrap.classList.add('hidden');
        countyWrap.classList.remove('flex');
      }
      if (currentTown) {
        townWrap.classList.remove('hidden');
        townWrap.classList.add('flex');
        document.getElementById('breadcrumb-town').textContent = currentTown.name;
      } else {
        townWrap.classList.add('hidden');
        townWrap.classList.remove('flex');
      }
      lucide.createIcons();
    }

    function goToCountyLevel() {
      closeDrawer();
      renderCountyLayer();
      selectCity.value = '';
      selectDistrict.innerHTML = '<option value="">選擇鄉鎮市區</option>';
      selectDistrict.disabled = true;
      selectVillage.innerHTML = '<option value="">選擇村里</option>';
      selectVillage.disabled = true;
    }

    function goToTownLevel() {
      if (!currentCounty) return;
      closeDrawer();
      currentTown = null;
      updateBreadcrumb();
      selectDistrict.value = '';
      selectVillage.innerHTML = '<option value="">選擇村里</option>';
      selectVillage.disabled = true;
      renderTownLayer(currentCounty.code);
      const f = currentCounty.feature;
      renderDrawer(f.properties.name, `${f.properties.name}首長選舉`, f.properties.category,
        f.properties.voters, f.properties.quota, f.properties.candidates,
        { label: '議員候選人（依選舉區）', blocks: f.properties.councilors });
    }

    function resetAllFilters() {
      goToCountyLevel();
    }

    // 7. 抽屜渲染
    function renderCandidateCard(c) {
      const party = partyConfig(c.party);
      const gazetteBlock = c.gazetteUrl
        ? `
          <a href="${c.gazetteUrl}" target="_blank" class="w-full inline-flex items-center justify-center space-x-2 py-2.5 rounded-xl bg-ink-900 text-surface text-xs font-bold hover:bg-accent-orange transition">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
            <span>查閱官方選舉公報 (PDF)</span>
          </a>
        `
        : `
          <div class="bg-canvas/90 p-3 rounded-xl border border-ink-100 flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-accent-yellow animate-pulse"></span>
              <span class="text-[11px] font-bold text-ink-700">選舉公報審定中</span>
            </div>
            <span class="text-[10px] font-extrabold text-ink-500 bg-surface px-2 py-0.5 rounded border border-ink-300">
              待中選會統一公布
            </span>
          </div>
        `;

      return `
        <div class="card-brutal bg-surface rounded-2xl p-4 sm:p-5 space-y-3 relative overflow-hidden">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-12 h-12 rounded-xl bg-canvas border editorial-border flex items-center justify-center font-black text-ink-900 text-base shadow-sm">
                ${c.name.slice(0, 1)}
              </div>
              <div>
                <h4 class="text-base font-black text-ink-900">${c.name}</h4>
                <div class="flex items-center space-x-1.5 mt-0.5">
                  ${party.svgLogo}
                  <span class="text-xs font-black text-ink-700">${c.party}</span>
                  <span class="text-ink-300">•</span>
                  <span class="text-[11px] font-bold text-accent-orange">${c.role}</span>
                </div>
              </div>
            </div>
            <span class="text-[10px] font-black uppercase px-2 py-1 rounded bg-canvas border border-ink-300 text-ink-500">已登記</span>
          </div>
          <div class="pt-1">${gazetteBlock}</div>
        </div>
      `;
    }

    function renderDrawer(path, title, tag, voters, quota, candidates, groupSection) {
      document.getElementById('drawer-path').textContent = path;
      document.getElementById('drawer-region-title').textContent = title;
      document.getElementById('drawer-region-tag').textContent = tag;
      document.getElementById('drawer-voter-count').textContent = voters || '--';
      document.getElementById('drawer-quota').textContent = quota || '--';

      const container = document.getElementById('candidates-container');
      let html = '';

      if (!candidates || candidates.length === 0) {
        html += `
          <div class="bg-surface p-6 rounded-2xl border editorial-border text-center space-y-2">
            <i data-lucide="info" class="w-6 h-6 text-ink-500 mx-auto"></i>
            <p class="text-xs font-bold text-ink-700">該選區目前登記名冊核定中</p>
          </div>
        `;
      } else {
        html += candidates.map(renderCandidateCard).join('');
      }

      if (groupSection && groupSection.blocks && groupSection.blocks.length > 0) {
        html += `
          <div class="pt-3 pb-1 flex items-center space-x-2">
            <span class="h-px flex-1 bg-ink-100"></span>
            <span class="text-[10px] font-black uppercase tracking-wider text-ink-500">${groupSection.label}</span>
            <span class="h-px flex-1 bg-ink-100"></span>
          </div>
        `;
        html += groupSection.blocks.map(block => `
          <div class="space-y-2">
            <div class="text-[11px] font-black text-ink-500">第 ${block.district} 選舉區</div>
            <div class="space-y-2">${block.candidates.map(renderCandidateCard).join('')}</div>
          </div>
        `).join('');
      }

      container.innerHTML = html;
      document.getElementById('detail-drawer').classList.remove('translate-x-full');
      lucide.createIcons();
    }

    function closeDrawer() {
      document.getElementById('detail-drawer').classList.add('translate-x-full');
    }

    // 8. 分頁切換
    function switchView(viewName) {
      const viewMap = document.getElementById('view-map');
      const viewLinks = document.getElementById('view-links');
      const tabMap = document.getElementById('tab-map');
      const tabLinks = document.getElementById('tab-links');
      const filterBar = document.getElementById('filter-bar');

      if (viewName === 'map') {
        viewMap.classList.remove('hidden');
        viewLinks.classList.add('hidden');
        filterBar.classList.remove('hidden');
        tabMap.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 bg-ink-900 text-surface shadow-sm';
        tabLinks.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 text-ink-700 hover:text-ink-900';
        map.invalidateSize();
      } else {
        viewMap.classList.add('hidden');
        viewLinks.classList.remove('hidden');
        filterBar.classList.add('hidden');
        tabLinks.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 bg-ink-900 text-surface shadow-sm';
        tabMap.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 text-ink-700 hover:text-ink-900';
        renderSites();
      }
      lucide.createIcons();
    }

    function renderSites() {
      const grid = document.getElementById('sites-grid');
      grid.innerHTML = CURATED_SITES.map(s => `
        <div class="card-brutal bg-surface rounded-2xl p-6 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-black uppercase px-2.5 py-1 rounded bg-canvas border border-ink-300 text-ink-700">
                ${s.category}
              </span>
              <i data-lucide="external-link" class="w-4 h-4 text-ink-500"></i>
            </div>
            <h3 class="text-lg font-black text-ink-900">${s.name}</h3>
            <p class="text-xs text-ink-500 font-medium leading-relaxed">${s.desc}</p>
          </div>
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center space-x-1.5 py-2.5 rounded-xl bg-canvas border editorial-border text-xs font-extrabold text-ink-900 hover:bg-ink-900 hover:text-surface transition">
            <span>造訪官方平台</span>
            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // 9. 啟動
    async function init() {
      try {
        await renderCountyLayer();
      } catch (err) {
        console.error('地圖資料載入失敗', err);
        document.getElementById('breadcrumb-bar').insertAdjacentHTML('beforeend',
          `<span class="pointer-events-auto text-[11px] font-black px-3 py-1.5 rounded-full bg-red-600 text-white">資料載入失敗，請確認 ./data 目錄是否存在</span>`);
      }
      document.body.classList.add('splash-loaded');
      lucide.createIcons();
    }
    window.addEventListener('load', init);
  </script>
</body>
</html>
