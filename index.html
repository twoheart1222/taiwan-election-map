<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 年選舉倒數與地方觀測</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <!-- 導覽列 -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 text-white font-bold text-lg hover:text-emerald-400 transition">
        <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>2026 選舉觀測站</span>
      </a>
      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="index.html" class="text-emerald-400">首頁倒數</a>
        <a href="observatory.dc.html" class="text-slate-300 hover:text-white transition">席次觀測</a>
        <a href="support.dc.html" class="text-slate-300 hover:text-white transition">資料支援</a>
      </nav>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-5xl mx-auto px-4 py-12 w-full text-center flex flex-col items-center justify-center">
    <div class="inline-block px-4 py-1.5 rounded-full bg-emerald-950/70 border border-emerald-500/30 text-emerald-400 text-xs font-semibold mb-6 tracking-wider uppercase">
      Countdown to 2026 Elections
    </div>
    
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 text-white">
      距離 2026 九合一選舉還有
    </h1>
    <p class="text-slate-400 mb-10 max-w-xl mx-auto text-sm md:text-base">
      精確追蹤九合一地方公職人員選舉時程、各縣市選情觀察與席次異動。
    </p>

    <!-- 倒數計時卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-2xl mb-12">
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
        <span id="days" class="block text-4xl md:text-5xl font-extrabold text-white">00</span>
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1 block">天</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
        <span id="hours" class="block text-4xl md:text-5xl font-extrabold text-white">00</span>
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1 block">小時</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
        <span id="minutes" class="block text-4xl md:text-5xl font-extrabold text-white">00</span>
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1 block">分鐘</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl">
        <span id="seconds" class="block text-4xl md:text-5xl font-extrabold text-emerald-400">00</span>
        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest mt-1 block">秒</span>
      </div>
    </div>

    <!-- 快捷按鈕 -->
    <div class="flex flex-wrap justify-center gap-4">
      <a href="observatory.dc.html" class="px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold transition shadow-lg shadow-emerald-500/20">
        查看各縣市觀測站 →
      </a>
      <a href="support.dc.html" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium border border-slate-700 transition">
        查詢數據與配額
      </a>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    2026 選舉倒數資訊平台 · 資料以選委會官方公告為準
  </footer>

  <script>
    // 預估投票日：2026-11-28 08:00:00
    const targetDate = new Date('2026-11-28T08:00:00+08:00').getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = String(days).padStart(2, '0');
        document.getElementById('hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
        document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
      }
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
