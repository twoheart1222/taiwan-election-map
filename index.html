<style>
/* Organic — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
@import url('https://fonts.googleapis.com/css2?family=Caprasimo:wght@400&family=Figtree:wght@400;600;700&display=swap');

:root {
  --color-bg: #f5ead8;
  --color-surface: #ebddc5;
  --color-text: #201e1d;
  --color-accent: #c67139;
  --color-accent-2: #7a8a5e;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f9f4ed;
  --color-neutral-200: #eee7db;
  --color-neutral-300: #dcd3c4;
  --color-neutral-400: #c0b6a5;
  --color-neutral-500: #a19786;
  --color-neutral-600: #82796a;
  --color-neutral-700: #645c50;
  --color-neutral-800: #474238;
  --color-neutral-900: #2e2b25;

  --color-accent-100: #fff2eb;
  --color-accent-200: #ffe1d0;
  --color-accent-300: #ffc6a5;
  --color-accent-400: #f6a06b;
  --color-accent-500: #d67f48;
  --color-accent-600: #b2622d;
  --color-accent-700: #8c491a;
  --color-accent-800: #643312;
  --color-accent-900: #402310;

  --color-accent-2-100: #f0fae1;
  --color-accent-2-200: #e1eecc;
  --color-accent-2-300: #ccdbb2;
  --color-accent-2-400: #aebf92;
  --color-accent-2-500: #8fa073;
  --color-accent-2-600: #728157;
  --color-accent-2-700: #56633f;
  --color-accent-2-800: #3d472b;
  --color-accent-2-900: #272e1b;

  --font-heading: "Caprasimo", system-ui, sans-serif;
  --font-heading-weight: 400;
  --font-body: "Figtree", system-ui, sans-serif;

  --space-1: 4.4px;
  --space-2: 8.8px;
  --space-3: 13.2px;
  --space-4: 17.6px;
  --space-6: 26.4px;
  --space-8: 35.2px;

  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 28px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* — rounded frame: everything softens, small controls go pill — */
.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }
.btn, .tag, .seg, .input { border-radius: 999px; }
.input { padding-inline: 14px; }


</style>

<style>
  :root { --mo: 1; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; font-family: "Figtree", "Noto Sans TC", system-ui, sans-serif; background: var(--color-bg); }

  .region-tooltip::before { display: none; }

        <span style="position:absolute;right:120px;bottom:-120px;width:220px;height:220px;border-radius:50%;background:var(--color-accent-2-200);opacity:.7"></span>
        <div style="position:relative;max-width:620px;display:flex;flex-direction:column;gap:14px;align-items:flex-start">
          <span class="tag tag-outline" style="display:inline-flex;gap:7px;align-items:center;white-space:nowrap;padding:5px 14px;font-weight:700;letter-spacing:.1em">
            <i data-lucide="shield-check" style="width:14px;height:14px" stroke-width="2.75"></i>CURATED DIRECTORY
          </span>
          <h2 style="font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:40px;margin:0;line-height:1.3">政治資料與公民觀測站</h2>
          <p style="margin:0;font-size:14.5px;line-height:1.7;color:var(--color-neutral-700);max-width:520px;text-wrap:pretty">
            收錄中央選舉委員會公開資料庫、國會議事轉播、政治獻金平台與優質公民科技專案。
          </p>
          <span style="display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--color-bg);font-size:12px;font-weight:500;color:var(--color-neutral-700)">
            <i data-lucide="lock" style="width:14px;height:14px;color:var(--color-accent)" stroke-width="2.75"></i>
            本站連結由維護者統一校閱發布，確保資訊真實可信。
          </span>

      <div id="sites-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px"></div>

</div>
<script>
class App {
  start() {
    const motion = window.MOTION || '高調';
    const mo = motion === '低調' ? 0.6 : motion === '高調' ? 1.45 : 1;
    document.documentElement.style.setProperty('--mo', mo);
    this.mo = mo;
    this.boot();
  }

  // ————— Firebase overrides (unchanged logic, loaded on demand) —————
  fetchOverrides() {
    const cfg = {
      apiKey: "AIzaSyAZdhEkMeCER-eh_De2viLi0jG2kD2f_4A",
      authDomain: "taiwan-election-map.firebaseapp.com",
      projectId: "taiwan-election-map",
      storageBucket: "taiwan-election-map.firebasestorage.app",
      messagingSenderId: "603857399918",
      appId: "1:603857399918:web:44fb7f95b20e127ad1b67f"
    };
    if (cfg.apiKey === 'YOUR_API_KEY') return Promise.resolve({});
    if (this._ov) return this._ov;
    this._ov = (async () => {
      try {
        const [{ initializeApp }, { getFirestore, collection, getDocs }] = await Promise.all([
          import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js'),
          import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js'),
        ]);
        const snap = await getDocs(collection(getFirestore(initializeApp(cfg)), 'overrides'));
        const out = {};
        snap.forEach(d => { out[d.id] = d.data(); });
        return out;
      } catch (err) {
        console.warn('讀取後台編輯資料失敗，僅顯示原始候選人資料。', err);
        return {};
      }
    })();
    return this._ov;
  }

  applyOverrides(topo, overrides) {
    if (!overrides || !Object.keys(overrides).length) return topo;
    const key = Object.keys(topo.objects)[0];
    topo.objects[key].geometries.forEach(g => {
      const o = overrides[g.properties.id];
      if (!o) return;
      if (o.candidates) g.properties.candidates = o.candidates;
      if (o.councilors) g.properties.councilors = o.councilors;
      if (o.representatives) g.properties.representatives = o.representatives;
      if (o.voters !== undefined) g.properties.voters = o.voters;
      if (o.quota !== undefined) g.properties.quota = o.quota;
    });
    return topo;
  }

  // ————— party marks —————
  partyConfig(name) {
    const chip = (bg, fg, ch) => `<span style="width:24px;height:24px;flex:none;border-radius:50%;background:${bg};color:${fg};display:inline-flex;align-items:center;justify-content:center;font:700 13px 'Noto Sans TC',sans-serif">${ch}</span>`;
    const P = {
      '民主進步黨': { color: '#1B9431', logo: chip('#1B9431', '#fff', '民') },
      '中國國民黨': { color: '#002B82', logo: chip('#002B82', '#fff', '國') },
      '台灣民眾黨': { color: '#28C7C7', logo: chip('#28C7C7', '#fff', '眾') },
      '時代力量': { color: '#F5C200', logo: chip('#F5C200', '#201e1d', '力') },
      '無黨籍': { color: '#82796a', logo: chip('var(--color-neutral-300)', '#201e1d', '無') },
      '無': { color: '#82796a', logo: chip('var(--color-neutral-300)', '#201e1d', '無') },
    };
    return P[name] || { color: '#82796a', logo: chip('var(--color-neutral-300)', '#201e1d', '黨') };
  }

  get SITES() {
    return [
      { name: '中選會選舉資料庫網站', category: '官方數據庫', url: 'https://db.cec.gov.tw/', desc: '中央選舉委員會歷屆公職選舉、登記名冊與官方選舉公報查詢。' },
      { name: '立法院議事轉播 (IVOD)', category: '政見與法案監督', url: 'https://ivod.ly.gov.tw/', desc: '國會院會與各委員會全天候即時視訊轉播與歷史隨選隨播系統。' },
      { name: '監察院政治獻金公開平臺', category: '陽光法案開放', url: 'https://ardata.cy.gov.tw/', desc: '全民共同檢驗各政黨與候選人合法申報之收支帳冊與競選資金流向。' },
      { name: '沃草 Watchout 國會觀測', category: '公民科技媒體', url: 'https://watchout.tw/', desc: '以圖文與資訊設計降低公民政治參與門檻的獨立媒體平台。' },
      { name: '政治開箱 Politics Design', category: '政治視覺研究', url: 'https://politicsdesign.tw/', desc: '台灣當代政治競選美學與民主視覺溝通研究平台。' },
    ];
  }

  // ————— boot —————
  boot() {
    const $ = id => document.getElementById(id);
    this.$ = $;
    this.selCity = $('select-city');
    this.selDist = $('select-district');
    this.selVill = $('select-village');

    this.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([23.8, 120.9], 8);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16, attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    }).addTo(this.map);
    L.control.zoom({ position: 'bottomright' }).addTo(this.map);

    this.view = 'map';
    this.layer = null; this.counties = null; this.towns = {}; this.villages = {};
    this.county = null; this.town = null;

    $('brand').onclick = () => this.switchView('map');
    $('tab-map').onclick = () => this.switchView('map');
    $('tab-links').onclick = () => this.switchView('links');
    $('btn-reset').onclick = () => this.goCounty();
    $('drawer-close').onclick = () => this.goCounty();
    $('bc-all').onclick = () => this.goCounty();
    $('bc-county').onclick = () => this.goTown();
    $('mobile-filter-toggle').onclick = () => this.toggleFilters();

    this.selCity.addEventListener('change', () => {
      const o = this.selCity.selectedOptions[0];
      if (!o || !o.value) { this.goCounty(); return; }
      this.pickCounty(o.dataset.code);
    });
    this.selDist.addEventListener('change', () => {
      const o = this.selDist.selectedOptions[0];
      if (!o || !o.value) { this.renderTowns(this.county.code); return; }
      this.pickTown(o.dataset.code);
    });
    this.selVill.addEventListener('change', () => {
      const name = this.selVill.value;
      if (!name) return;
      const f = this.features(this.villages[this.town.code]).features.find(x => x.properties.name === name);
      if (f) this.openVillage(f);
      this.closeFilters();
    });

    this.syncResponsive();
    window.addEventListener('resize', () => this.syncResponsive());
    this.layoutTabs();
    this.renderSites();
    this.init();
  }

  syncResponsive() {
    const wide = window.innerWidth > 1120;
    this.$('tabs').style.display = window.innerWidth > 860 ? 'flex' : 'none';
    this.$('brand-kicker').style.display = window.innerWidth > 900 ? 'flex' : 'none';
    this.$('hint-card').style.display = window.innerWidth > 900 ? 'block' : 'none';
    this.$('mobile-filter-toggle').style.display = wide ? 'none' : 'inline-flex';
    const bar = this.$('filter-bar');
    if (wide) { bar.classList.remove('om-open'); bar.style.display = this.view === 'links' ? 'none' : 'flex'; }
    else if (!bar.classList.contains('om-open')) bar.style.display = 'none';
    this.layoutTabs();
  }

  layoutTabs() {
    const pill = this.$('tab-pill'), active = this.$(this.view === 'links' ? 'tab-links' : 'tab-map');
    if (!pill || !active || !active.offsetWidth) return;
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = `translateX(${active.offsetLeft - 4}px)`;
  }

  async init() {
    try {
      this.districtMap = await this.json('./data/district_town_map.json').catch(() => ({}));
      this.quotaMap = await this.json('./data/district_quota.json').catch(() => ({}));
      await this.renderCounties();
    }
    catch (err) {
      console.error('地圖資料載入失敗', err);
      this.$('breadcrumb-bar').insertAdjacentHTML('beforeend',
        `<span style="pointer-events:auto;padding:8px 16px;border-radius:999px;background:var(--color-accent-800);color:var(--color-bg);font:700 12px 'Noto Sans TC',sans-serif">資料載入失敗，請確認 ./data 目錄是否存在</span>`);
    }
    setTimeout(() => {
      const s = this.$('splash');
      s.style.opacity = '0'; s.style.visibility = 'hidden'; s.style.transform = 'scale(1.04)';
      setTimeout(() => s.remove(), 900);
    }, 520 * this.mo);
    lucide.createIcons();
  }

  // ————— geo helpers —————
  async json(url) { const r = await fetch(url); if (!r.ok) throw new Error('載入失敗: ' + url); return r.json(); }
  features(topo) { const k = Object.keys(topo.objects)[0]; return topojson.feature(topo, topo.objects[k]); }
  levelStyle(level) {
    const fill = { county: '#c67139', town: '#7a8a5e', village: '#b2622d' }[level];
    return { weight: 1.25, color: '#201e1d', opacity: 0.35, fillColor: fill, fillOpacity: 0.16 };
  }
  clearLayer() { if (this.layer) { this.map.removeLayer(this.layer); this.layer = null; } }

  /* staggered fade-in of the freshly drawn boundaries */
  animateLayer() {
    if (!this.layer) return;
    let i = 0;
    this.layer.eachLayer(l => {
      const el = l.getElement && l.getElement();
      if (!el) return;
      el.style.transition = 'none';
      el.style.opacity = '0';
      const d = Math.min(i++ * 9 * this.mo, 700);
      setTimeout(() => { el.style.transition = 'opacity .5s ease'; el.style.opacity = '1'; }, d + 30);
    });
  }

  bindRegion(level, feature, layer, onClick) {
    const base = level === 'village' ? 0.18 : 0.16;
    layer.bindTooltip(feature.properties.name, { sticky: true, direction: 'top', className: 'region-tooltip' });
    layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.42, weight: 2 }));
    layer.on('mouseout', () => layer.setStyle({ fillOpacity: base, weight: 1.25 }));
    layer.on('click', onClick);
  }

  async renderCounties() {
    this.clearLayer(); this.county = null; this.town = null; this.breadcrumb();
    if (!this.counties) {
      const [topo, ov] = await Promise.all([this.json('./data/counties.json'), this.fetchOverrides()]);
      this.counties = this.applyOverrides(topo, ov);
      this.fillCity(this.counties);
    }
    this.layer = L.geoJson(this.features(this.counties), {
      style: () => this.levelStyle('county'),
      onEachFeature: (f, l) => this.bindRegion('county', f, l, () => { this.selCity.value = f.properties.name; this.pickCounty(f.properties.id); }),
    }).addTo(this.map);
    this.animateLayer();
    this.map.flyTo([23.8, 120.9], 8, { duration: 1.1 * this.mo });
  }

  async renderTowns(countyCode) {
    this.clearLayer(); this.town = null;
    if (!this.towns[countyCode]) {
      const [topo, ov] = await Promise.all([this.json(`./data/towns/towns-${countyCode}.json`), this.fetchOverrides()]);
      this.towns[countyCode] = this.applyOverrides(topo, ov);
    }
    const topo = this.towns[countyCode];
    this.layer = L.geoJson(this.features(topo), {
      style: () => this.levelStyle('town'),
      onEachFeature: (f, l) => this.bindRegion('town', f, l, () => { this.selDist.value = f.properties.name; this.pickTown(f.properties.id); }),
    }).addTo(this.map);
    this.animateLayer();
    this.fillDistrict(topo);
    try { this.map.flyToBounds(this.layer.getBounds(), { padding: [50, 50], duration: 1.15 * this.mo }); }
    catch (e) { this.map.flyTo(this.layer.getBounds().getCenter(), 11); }
  }

  async renderVillages(townCode) {
    this.clearLayer();
    if (!this.villages[townCode]) {
      const [topo, ov] = await Promise.all([this.json(`./data/villages/villages-${townCode}.json`), this.fetchOverrides()]);
      this.villages[townCode] = this.applyOverrides(topo, ov);
    }
    const topo = this.villages[townCode];
    this.layer = L.geoJson(this.features(topo), {
      style: () => this.levelStyle('village'),
      onEachFeature: (f, l) => this.bindRegion('village', f, l, () => this.openVillage(f)),
    }).addTo(this.map);
    this.animateLayer();
    this.fillVillage(topo);
    try { this.map.flyToBounds(this.layer.getBounds(), { padding: [70, 70], duration: 1.1 * this.mo }); } catch (e) {}
  }

  // ————— selects —————
  options(sel, features, withCat) {
    features.slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant')).forEach(f => {
      const o = document.createElement('option');
      o.value = f.properties.name;
      o.dataset.code = f.properties.id;
      o.textContent = withCat ? `${f.properties.name} (${f.properties.category})` : f.properties.name;
      sel.appendChild(o);
    });
  }
  fillCity(topo) { this.selCity.innerHTML = '<option value="">選擇縣市 (22)</option>'; this.options(this.selCity, this.features(topo).features, true); }
  fillDistrict(topo) {
    this.selDist.innerHTML = '<option value="">選擇鄉鎮市區</option>'; this.selDist.disabled = false;
    this.selVill.innerHTML = '<option value="">選擇村里</option>'; this.selVill.disabled = true;
    this.options(this.selDist, this.features(topo).features, false);
  }
  fillVillage(topo) {
    this.selVill.innerHTML = '<option value="">選擇村里</option>'; this.selVill.disabled = false;
    this.options(this.selVill, this.features(topo).features, false);
  }

  // 幫選舉區配上真正的行政區名稱（如果有對照資料的話），沒有對照資料的
  // 縣市就自動退回只顯示選舉區編號，不會壞掉
  districtLabel(countyCode, block) {
    const info = this.districtMap?.[countyCode]?.districts?.[block.district];
    const towns = (info && info.towns && info.towns.length) ? info.towns.join('、') : null;
    return towns ? `第 ${block.district} 選舉區（${towns}）` : `第 ${block.district} 選舉區`;
  }

  async pickCounty(code) {
    const f = this.features(this.counties).features.find(x => x.properties.id === code);
    if (!f) return;
    this.county = { code, name: f.properties.name, feature: f };
    this.breadcrumb();
    this.drawer(f.properties.name, `${f.properties.name}首長選舉`, f.properties.category, f.properties.voters, f.properties.quota,
      f.properties.candidates, { label: '議員候選人（依選舉區）', blocks: f.properties.councilors, countyCode: code });
    await this.renderTowns(code);
  }

  async pickTown(code) {
    const f = this.features(this.towns[this.county.code]).features.find(x => x.properties.id === code);
    if (!f) return;
    this.town = { code, name: f.properties.name, feature: f };
    this.breadcrumb();
    const tag = f.properties.isIndigenousDistrict ? '山地原住民區' : '行政區轄區';
    const repLabel = f.properties.isIndigenousDistrict ? '區民代表候選人（依選舉區）' : '鄉鎮市民代表候選人（依選舉區）';
    const cands = (f.properties.candidates && f.properties.candidates.length) ? f.properties.candidates : this.county.feature.properties.candidates;
    this.drawer(`${this.county.name} › ${f.properties.name}`, `${f.properties.name} 公職名冊`, tag, f.properties.voters, f.properties.quota,
      cands, { label: repLabel, blocks: f.properties.representatives });
    await this.renderVillages(code);
  }

  openVillage(f) {
    const name = f.properties.name;
    this.selVill.value = name;
    const role = name.endsWith('里') ? '里長選舉' : '村長選舉';
    this.drawer(`${this.county.name} › ${this.town.name} › ${name}`, `${name} ${role}`, '最基層村里',
      f.properties.voters, f.properties.quota || '1 席', f.properties.candidates, null);
  }

  // ————— breadcrumb / navigation —————
  breadcrumb() {
    const cw = this.$('bc-county-wrap'), tw = this.$('bc-town-wrap');
    cw.style.display = this.county ? 'flex' : 'none';
    if (this.county) this.$('bc-county').textContent = this.county.name;
    tw.style.display = this.town ? 'flex' : 'none';
    if (this.town) this.$('bc-town').textContent = this.town.name;
    lucide.createIcons();
  }

  goCounty() {
    this.$('drawer').style.transform = 'translateX(102%)';
    this.closeFilters();
    this.renderCounties();
    this.selCity.value = '';
    this.selDist.innerHTML = '<option value="">選擇鄉鎮市區</option>'; this.selDist.disabled = true;
    this.selVill.innerHTML = '<option value="">選擇村里</option>'; this.selVill.disabled = true;
  }

  goTown() {
    if (!this.county) return;
    this.town = null; this.breadcrumb();
    this.selDist.value = '';
    this.selVill.innerHTML = '<option value="">選擇村里</option>'; this.selVill.disabled = true;
    this.renderTowns(this.county.code);
    const f = this.county.feature;
    this.drawer(f.properties.name, `${f.properties.name}首長選舉`, f.properties.category, f.properties.voters, f.properties.quota,
      f.properties.candidates, { label: '議員候選人（依選舉區）', blocks: f.properties.councilors, countyCode: this.county.code });
  }

  toggleFilters() {
    const bar = this.$('filter-bar');
    const open = !bar.classList.contains('om-open');
    bar.classList.toggle('om-open', open);
    bar.style.display = open ? 'flex' : 'none';
  }
  closeFilters() {
    const bar = this.$('filter-bar');
    bar.classList.remove('om-open');
    if (window.innerWidth <= 1120) bar.style.display = 'none';
  }

  // ————— count-up —————
  countUp(el, raw) {
    const text = raw == null || raw === '' ? '--' : String(raw);
    const m = text.match(/[\d,]+/);
    if (!m) { el.textContent = text; return; }
    const target = parseInt(m[0].replace(/,/g, ''), 10);
    const pre = text.slice(0, m.index), post = text.slice(m.index + m[0].length);
    const dur = 750 * this.mo, t0 = performance.now();
    if (el._raf) cancelAnimationFrame(el._raf);
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1);
      const v = Math.round(target * (1 - Math.pow(1 - p, 3)));
      el.textContent = pre + v.toLocaleString('en-US') + post;
      if (p < 1) el._raf = requestAnimationFrame(tick);
    };
    el._raf = requestAnimationFrame(tick);
  }

  // ————— candidate cards —————
  card(c, i) {
    const p = this.partyConfig(c.party);
    const delay = (0.04 * i * this.mo).toFixed(2);
    const gazette = c.gazetteUrl
      ? `<a href="${c.gazetteUrl}" target="_blank" rel="noopener" class="btn btn-primary btn-block" style="gap:8px;padding:11px;font-size:13px">
           <i data-lucide="file-text" style="width:15px;height:15px" stroke-width="2.75"></i><span>查閱官方選舉公報 (PDF)</span></a>`
      : `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:999px;background:var(--color-neutral-200)">
           <span style="display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--color-neutral-700)">
             <span style="width:7px;height:7px;border-radius:50%;background:var(--color-accent);animation:om-ring 1.8s ease-out infinite"></span>選舉公報審定中</span>
           <span class="tag tag-neutral" style="font-size:10px">待中選會統一公布</span></div>`;
    const socials = [['facebook', 'Facebook'], ['instagram', 'Instagram'], ['threads', 'Threads'], ['youtube', 'YouTube']].filter(s => c[s[0]]);
    const socialBlock = socials.length ? `<div style="display:flex;flex-wrap:wrap;gap:7px">${socials.map(s =>
      `<a href="${c[s[0]]}" target="_blank" rel="noopener noreferrer" style="padding:4px 13px;border-radius:999px;background:var(--color-surface);font-size:11px;font-weight:700;color:var(--color-neutral-700);text-decoration:none">${s[1]}</a>`).join('')}</div>` : '';
    const avatar = c.photoUrl
      ? `<img src="${c.photoUrl}" alt="${c.name}" class="washed" loading="lazy" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.textContent='${(c.name || '').slice(0, 1)}'">`
      : (c.name || '').slice(0, 1);
    return `
      <article class="om-lift" style="background:var(--color-surface);border-radius:32px;padding:20px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow-sm);animation:om-rise-sm .55s cubic-bezier(.16,1,.3,1) ${delay}s both">
        <div style="display:flex;align-items:center;gap:15px">
          <div style="width:74px;height:74px;flex:none;border-radius:50%;overflow:hidden;background:var(--color-neutral-200);display:grid;place-items:center;font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:26px">${avatar}</div>
          <div style="min-width:0;flex:1">
            <h4 style="font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:21px;margin:0">${c.name}</h4>
            <div style="display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap">
              ${p.logo}
              <span style="font-size:12.5px;font-weight:700">${c.party}</span>
              <span style="width:4px;height:4px;border-radius:50%;background:var(--color-neutral-400)"></span>
              <span style="font-size:12px;font-weight:700;color:var(--color-accent-700)">${c.role}</span>
            </div>
          </div>
          ${c.isIncumbent ? '<span class="tag tag-accent-2" style="flex:none;font-weight:700">爭取連任</span>' : ''}
        </div>
        ${socialBlock}
        ${gazette}
      </article>`;
  }

  drawer(path, title, tag, voters, quota, candidates, group) {
    this.$('drawer-path').textContent = path;
    this.$('drawer-title').textContent = title;
    this.$('drawer-tag').textContent = tag;
    this.countUp(this.$('stat-voters'), voters);
    this.countUp(this.$('stat-quota'), quota);
    this.countUp(this.$('stat-registered'), (candidates && candidates.length) ? `${candidates.length} 人` : '0 人');

    const box = this.$('candidates');
    let html = '';
    if (!candidates || !candidates.length) {
      html += `<div style="background:var(--color-surface);border-radius:32px;padding:28px;text-align:center;animation:om-rise-sm .5s cubic-bezier(.16,1,.3,1) both">
        <i data-lucide="info" style="width:22px;height:22px;color:var(--color-accent)" stroke-width="2.75"></i>
        <p style="margin:10px 0 0;font-size:13px;font-weight:700;color:var(--color-neutral-700)">該選區目前登記名冊核定中</p></div>`;
    } else {
      html += candidates.map((c, i) => this.card(c, i)).join('');
    }

    if (group && group.blocks && group.blocks.length) {
      const total = group.blocks.reduce((s, b) => s + b.candidates.length, 0);
      html += `
        <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
          <span style="flex:1;height:1px;background:var(--color-divider)"></span>
          <span style="font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--color-neutral-600);text-align:center">${group.label}（共 ${total} 人登記）</span>
          <span style="flex:1;height:1px;background:var(--color-divider)"></span>
        </div>
        <select id="district-picker" class="om-sel" style="width:100%;background-color:var(--color-bg)">
          <option value="">選擇選舉區查看候選人</option>
          ${group.blocks.map(b => `<option value="${b.district}">${this.districtLabel(group.countyCode, b)}（${b.candidates.length} 人登記）</option>`).join('')}
        </select>
        <div id="district-stats" style="display:none;grid-template-columns:1fr 1fr;gap:10px">
          <div style="background:var(--color-accent-100);border-radius:20px;padding:11px;text-align:center">
            <span style="display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--color-accent-700)">應選席次</span>
            <span id="district-quota" style="font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:17px;color:var(--color-accent-800)">--</span>
          </div>
          <div style="background:var(--color-accent-2-100);border-radius:20px;padding:11px;text-align:center">
            <span style="display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--color-accent-2-800)">登記席次</span>
            <span id="district-registered" style="font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:17px;color:var(--color-accent-2-800)">--</span>
          </div>
        </div>
        <div id="district-candidates" style="display:flex;flex-direction:column;gap:14px"></div>`;
    }

    box.innerHTML = html;
    box.scrollTop = 0;

    if (group && group.blocks && group.blocks.length) {
      const picker = this.$('district-picker'), out = this.$('district-candidates'), stats = this.$('district-stats');
      picker.addEventListener('change', () => {
        const b = group.blocks.find(x => x.district === picker.value);
        stats.style.display = b ? 'grid' : 'none';
        if (b) {
          const officialQuota = this.quotaMap?.[group.countyCode]?.[b.district];
          const quotaText = b.quota || (officialQuota ? `${officialQuota} 席` : null);
          this.countUp(this.$('district-quota'), quotaText);
          this.countUp(this.$('district-registered'), `${b.candidates.length} 人`);
        }
        out.innerHTML = b ? b.candidates.map((c, i) => this.card(c, i)).join('') : '';
        lucide.createIcons();
      });
    }

    this.$('drawer').style.transform = 'translateX(0)';
    lucide.createIcons();
  }

  // ————— views —————
  switchView(name) {
    if (this.view === name) return;
    this.view = name;
    const vm = this.$('view-map'), vl = this.$('view-links');
    const enter = el => {
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = `om-rise ${0.55 * this.mo}s cubic-bezier(.16,1,.3,1) both`;
    };
    if (name === 'map') {
      vl.style.display = 'none';
      vm.style.display = 'flex';
      enter(vm);
      this.$('tab-map').style.color = 'var(--color-bg)';
      this.$('tab-links').style.color = 'var(--color-text)';
      if (window.innerWidth > 1120) this.$('filter-bar').style.display = 'flex';
      else this.$('mobile-filter-toggle').style.display = 'inline-flex';
      setTimeout(() => this.map.invalidateSize(), 60);
    } else {
      vm.style.display = 'none';
      vl.style.display = 'block';
      enter(vl);
      this.closeFilters();
      this.$('filter-bar').style.display = 'none';
      this.$('mobile-filter-toggle').style.display = 'none';
      this.$('tab-links').style.color = 'var(--color-bg)';
      this.$('tab-map').style.color = 'var(--color-text)';
      this.renderSites();
    }
    this.layoutTabs();
    lucide.createIcons();
  }

  renderSites() {
    const grid = this.$('sites-grid');
    grid.innerHTML = this.SITES.map((s, i) => `
      <article class="om-lift" style="background:var(--color-surface);border-radius:36px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm);animation:om-rise ${0.55 * this.mo}s cubic-bezier(.16,1,.3,1) ${(0.07 * i * this.mo).toFixed(2)}s both">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
          <span class="tag tag-accent" style="font-weight:700;letter-spacing:.06em">${s.category}</span>
          <i data-lucide="external-link" style="width:16px;height:16px;color:var(--color-neutral-500)" stroke-width="2.75"></i>
        </div>
        <h3 style="font-family:'Caprasimo','Noto Serif TC',serif;font-weight:900;font-synthesis:none;font-size:22px;margin:2px 0 0;line-height:1.3">${s.name}</h3>
        <p style="margin:0;flex:1;font-size:13px;line-height:1.7;color:var(--color-neutral-700);text-wrap:pretty">${s.desc}</p>
        <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-block" style="padding:11px;font-size:13px;gap:8px">
          <span>造訪官方平台</span><i data-lucide="arrow-up-right" style="width:15px;height:15px" stroke-width="2.75"></i></a>
      </article>`).join('');
    lucide.createIcons();
  }

}

window.MOTION = '高調'; // 動畫強度：'低調' | '中等' | '高調'
document.addEventListener('DOMContentLoaded', () => new App().start());

</script>
</body>
</html>
