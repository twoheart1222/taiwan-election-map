<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷年總統選舉地圖｜島民觀察室 Formosa Observatory</title>
<meta name="description" content="島民觀察室歷年選舉地圖，整理 1996 至 2024 年總統副總統選舉結果與歷屆資料。">
<link rel="canonical" href="https://formosaobservatory.com/history/">
<meta name="theme-color" content="#0d0d0d">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="Formosa Observatory｜島民觀察室">
<meta property="og:title" content="歷年總統選舉地圖｜島民觀察室">
<meta property="og:description" content="1996–2024 歷屆總統副總統選舉結果，一次切換比較。">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--panel:#151311;--panel2:#1d1a17;--line:#302c27;--text:#f4f1ea;--muted:#918b82;--red:#E4022B;--yellow:#f6c945}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',system-ui,sans-serif}body{min-height:100vh}a{color:inherit;text-decoration:none}button{font:inherit}::selection{background:var(--red);color:#fff}
.site-nav{position:sticky;top:0;z-index:50;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);background:rgba(13,13,13,.88);backdrop-filter:blur(12px);border-bottom:1px solid #1c1a17}.brand{display:flex;align-items:center;gap:10px;font:900 16px 'Archivo','Noto Sans TC';letter-spacing:-.02em}.brand-dot{width:11px;height:11px;background:var(--red);border-radius:2px}.nav-right{display:flex;align-items:center;gap:22px;font:700 13px 'Archivo','Noto Sans TC';color:#b6afa4}.nav-right a:hover,.nav-right .on{color:var(--red)}
.hero{padding:clamp(34px,6vw,78px) clamp(16px,4vw,48px) 24px;border-bottom:1px solid #1c1a17;background:radial-gradient(85% 130% at 18% -20%,#23191a 0%,#0d0d0d 62%)}.kicker{font:800 11px 'Archivo';letter-spacing:.27em;color:var(--red);text-transform:uppercase}.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-top:16px}.hero h1{margin:0;font-size:clamp(38px,7vw,96px);line-height:.92;letter-spacing:-.055em;font-weight:900}.hero-copy{max-width:560px;color:#aaa39a;line-height:1.8;font-size:14px}.hero-copy strong{color:var(--text)}
.years-wrap{padding:18px clamp(16px,4vw,48px);position:sticky;top:62px;z-index:40;background:rgba(13,13,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid #1c1a17}.years{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.years::-webkit-scrollbar{display:none}.year-btn{flex:0 0 auto;border:1px solid var(--line);background:#151311;color:#aaa39a;border-radius:999px;padding:9px 15px;cursor:pointer;font:800 13px 'Archivo';transition:.2s}.year-btn:hover{border-color:var(--red);color:#fff}.year-btn.on{background:var(--red);border-color:var(--red);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr);min-height:calc(100vh - 190px)}.map-panel{position:relative;min-height:690px;border-right:1px solid #1c1a17;overflow:hidden;background:radial-gradient(90% 90% at 48% 44%,#171512 0%,#0d0d0d 70%)}#map{position:absolute;inset:72px 28px 40px}.map-title{position:absolute;z-index:5;top:28px;left:clamp(18px,3vw,38px)}.map-title small{display:block;color:var(--red);font:800 10px 'Archivo';letter-spacing:.2em}.map-title strong{display:block;margin-top:6px;font-size:20px}.map-status{position:absolute;z-index:5;left:clamp(18px,3vw,38px);bottom:28px;max-width:440px;color:#7f7971;font-size:12px;line-height:1.7}.map-status b{color:#aaa39a}.county{fill:#201d1a;stroke:#4a4540;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .18s,opacity .18s,stroke .18s}.county:hover{fill:#342d2b;stroke:#ddd6cb}.county.has-result:hover{opacity:.86}.tooltip{position:fixed;z-index:100;pointer-events:none;display:none;background:#f4f1ea;color:#0d0d0d;border-radius:10px;padding:9px 11px;box-shadow:0 12px 35px rgba(0,0,0,.35);font-size:12px;font-weight:800}
.result-panel{padding:clamp(24px,4vw,46px);background:#12100e}.election-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}.term{font:800 10px 'Archivo';letter-spacing:.2em;color:var(--red)}#election-title{margin:7px 0 0;font-size:clamp(25px,3.2vw,38px);line-height:1.15}.meta-stats{text-align:right;flex:none}.meta-stats strong{display:block;font:900 24px 'Archivo'}.meta-stats span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.section-label{margin:26px 0 12px;font:800 10px 'Archivo';letter-spacing:.2em;color:var(--muted)}.candidate-list{display:grid;gap:10px}.candidate{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:17px 18px}.candidate.elected{border-color:#5b5147}.candidate.elected:before{content:'當選';position:absolute;right:0;top:0;background:var(--yellow);color:#0d0d0d;padding:5px 10px;border-bottom-left-radius:10px;font-size:10px;font-weight:900}.cand-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline}.cand-name{font-size:18px;font-weight:900}.cand-no{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;margin-right:8px;background:#27231f;color:#d8d2c9;font:900 12px 'Archivo'}.cand-party{color:var(--muted);font-size:11px;font-weight:700;margin-top:5px}.cand-votes{text-align:right;flex:none;font:900 19px 'Archivo'}.cand-votes small{display:block;font:700 10px 'Archivo';color:var(--muted);margin-top:3px}.bar{height:5px;background:#282420;border-radius:999px;margin-top:13px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px}.county-detail{margin-top:26px;border-top:1px solid var(--line);padding-top:22px}.county-empty{border:1px dashed #3a3530;border-radius:14px;padding:16px;color:#918b82;font-size:12px;line-height:1.75}.county-empty strong{display:block;color:#d1cbc2;font-size:13px;margin-bottom:3px}.source{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);color:#736e67;font-size:11px;line-height:1.8}.source a{text-decoration:underline;text-underline-offset:4px;color:#aaa39a}.source a:hover{color:var(--red)}
@media(max-width:900px){.hero-row{display:block}.hero-copy{margin-top:22px}.layout{grid-template-columns:1fr}.map-panel{min-height:520px;border-right:0;border-bottom:1px solid #1c1a17}.result-panel{padding-bottom:60px}#map{inset:70px 10px 46px}.nav-right a:not(.on){display:none}}@media(max-width:520px){.site-nav{height:56px}.years-wrap{top:56px}.hero{padding-top:34px}.hero h1{font-size:50px}.map-panel{min-height:455px}.meta-stats strong{font-size:20px}.candidate{padding:14px}.cand-name{font-size:16px}.cand-votes{font-size:16px}}
</style>
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="../"><span class="brand-dot"></span><span>島民觀察室</span></a>
  <div class="nav-right"><a href="../">2026 選舉地圖</a><a class="on" href="./">歷年選舉</a></div>
</nav>
<header class="hero">
  <div class="kicker">FORMOSA OBSERVATORY / ELECTION ARCHIVE</div>
  <div class="hero-row">
    <h1>歷年<br>選舉地圖</h1>
    <div class="hero-copy"><strong>從一次選舉，拉長成一條時間線。</strong><br>先從 1996 年首次總統直選開始，切換年份比較候選組合、得票與投票率。架構預留各屆當時行政區的縣市、鄉鎮市區結果，不用把舊選舉硬套進今天的行政區。</div>
  </div>
</header>
<div class="years-wrap"><div id="years" class="years" aria-label="選擇總統選舉年份"></div></div>
<main class="layout">
  <section class="map-panel">
    <div class="map-title"><small>HISTORICAL MAP / 歷屆地圖</small><strong id="map-heading">2024 總統副總統選舉</strong></div>
    <svg id="map" role="img" aria-label="台灣縣市選舉地圖"></svg>
    <div id="map-status" class="map-status"></div>
  </section>
  <aside class="result-panel">
    <div class="election-meta">
      <div><div id="term" class="term"></div><h2 id="election-title"></h2></div>
      <div class="meta-stats"><strong id="turnout"></strong><span>投票率 TURNOUT</span></div>
    </div>
    <div class="section-label">全國得票 / NATIONAL RESULT</div>
    <div id="candidates" class="candidate-list"></div>
    <div class="county-detail">
      <div class="section-label">縣市結果 / COUNTY RESULT</div>
      <div id="county-detail" class="county-empty"></div>
    </div>
    <div class="source">資料來源：<a href="https://db.cec.gov.tw/Visual/?type=President" target="_blank" rel="noopener noreferrer">中央選舉委員會選舉資料庫</a>。本站為非官方整理；歷史選舉的行政區界以當屆資料為準。</div>
  </aside>
</main>
<div id="tooltip" class="tooltip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
const PARTY_COLORS={DPP:'#2daf5d',KMT:'#3b82f6',TPP:'#28c4c7',PFP:'#f59e0b',NP:'#f6c945',IND:'#9b948a'};
const fmt=new Intl.NumberFormat('zh-TW');
let archive=null,current=null,features=[],svg=null,path=null;
const $=id=>document.getElementById(id);

function candidatePercent(e,c){return e.validVotes?c.votes/e.validVotes*100:0}
function nameOf(f){return f?.properties?.name||f?.properties?.COUNTYNAME||f?.properties?.COUNTYNAME_1||f?.properties?.COUNTY||'未命名地區'}
function normalizeName(v){return String(v||'').replace(/台/g,'臺').replace(/縣$/,'縣').replace(/市$/,'市').trim()}
function resultForCounty(e,name){if(!e.countyResults)return null;const key=normalizeName(name);return e.countyResults[key]||e.countyResults[name]||null}

function renderYears(){
  $('years').innerHTML=archive.elections.map(e=>`<button class="year-btn${e.year===current.year?' on':''}" data-year="${e.year}">${e.year}</button>`).join('');
  document.querySelectorAll('.year-btn').forEach(btn=>btn.addEventListener('click',()=>selectYear(Number(btn.dataset.year))));
}
function renderElection(){
  const e=current;
  $('term').textContent=`第 ${String(e.term).padStart(2,'0')} 任 · ${e.date.replaceAll('-','.')}`;
  $('election-title').textContent=`${e.year} 總統副總統選舉`;
  $('map-heading').textContent=`${e.year} 總統副總統選舉`;
  $('turnout').textContent=`${e.turnout.toFixed(2)}%`;
  const rows=[...e.candidates].sort((a,b)=>b.votes-a.votes);
  $('candidates').innerHTML=rows.map(c=>{
    const pct=candidatePercent(e,c),color=PARTY_COLORS[c.partyKey]||PARTY_COLORS.IND;
    return `<article class="candidate${c.elected?' elected':''}"><div class="cand-head"><div><div class="cand-name"><span class="cand-no">${c.no}</span>${c.president}・${c.vicePresident}</div><div class="cand-party">${c.party}</div></div><div class="cand-votes">${fmt.format(c.votes)}<small>${pct.toFixed(2)}%</small></div></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></article>`
  }).join('');
  if(e.countyResults){$('map-status').innerHTML='<b>地圖已套用此屆縣市結果。</b> 滑過或點擊縣市查看票數。'}
  else{$('map-status').innerHTML='<b>目前先顯示行政區地圖框架。</b> 這一屆的縣市票數尚未匯入；舊屆資料將依當時行政區界建立快照，不直接套用 2026 現行界線。'}
  $('county-detail').innerHTML=e.countyResults?'<strong>選擇一個縣市</strong>將滑鼠移到地圖或點擊地區查看這一屆結果。':'<strong>縣市層級資料尚未匯入</strong>全國正式結果已可切換；下一層資料預留給中選會各屆縣市結果與歷史行政區界。';
  updateMap();
}
function selectYear(year){current=archive.elections.find(e=>e.year===year)||archive.elections[0];history.replaceState(null,'',`?year=${current.year}`);renderYears();renderElection()}
function updateMap(){
  if(!svg||!features.length)return;
  svg.selectAll('path.county').attr('class',d=>resultForCounty(current,nameOf(d))?'county has-result':'county').attr('fill',d=>{const r=resultForCounty(current,nameOf(d));return r?(PARTY_COLORS[r.winnerPartyKey]||'#4b4540'):null});
}
function showCounty(feature){
  const name=nameOf(feature),r=resultForCounty(current,name);
  if(!r){$('county-detail').innerHTML=`<strong>${name}</strong>${current.year} 年的縣市層級結果尚未匯入。`;return}
  const rows=[...(r.candidates||[])].sort((a,b)=>b.votes-a.votes);
  const total=rows.reduce((s,x)=>s+x.votes,0);
  $('county-detail').innerHTML=`<strong>${name}</strong>${rows.map(x=>`${x.president} ${fmt.format(x.votes)} 票（${total?(x.votes/total*100).toFixed(2):'0.00'}%）`).join('<br>')}`;
}
async function drawMap(){
  const topo=await fetch('../data/counties.json').then(r=>{if(!r.ok)throw new Error(`map ${r.status}`);return r.json()});
  const object=Object.values(topo.objects||{})[0];
  if(!object)throw new Error('找不到 TopoJSON objects');
  features=topojson.feature(topo,object).features;
  svg=d3.select('#map');
  const node=$('map'),w=Math.max(280,node.clientWidth),h=Math.max(340,node.clientHeight);
  svg.attr('viewBox',`0 0 ${w} ${h}`);
  const projection=d3.geoMercator().fitExtent([[20,14],[w-20,h-14]],{type:'FeatureCollection',features});
  path=d3.geoPath(projection);
  svg.selectAll('path').data(features).join('path').attr('class','county').attr('d',path)
    .on('mouseenter',(event,d)=>{const tip=$('tooltip'),name=nameOf(d),r=resultForCounty(current,name);tip.innerHTML=r?`${name}<br>${r.winner||'查看結果'}`:`${name}<br><span style="font-weight:600;color:#6f685f">${current.year} 縣市資料待匯入</span>`;tip.style.display='block';showCounty(d)})
    .on('mousemove',event=>{const tip=$('tooltip');tip.style.left=`${event.clientX+14}px`;tip.style.top=`${event.clientY+14}px`})
    .on('mouseleave',()=>{$('tooltip').style.display='none'})
    .on('click',(_,d)=>showCounty(d));
  updateMap();
}
async function init(){
  archive=await fetch('../data/history/presidential.json').then(r=>{if(!r.ok)throw new Error(`history ${r.status}`);return r.json()});
  const requested=Number(new URLSearchParams(location.search).get('year'));
  current=archive.elections.find(e=>e.year===requested)||archive.elections[0];
  renderYears();renderElection();
  try{await drawMap()}catch(err){console.error(err);$('map-status').innerHTML='<b>地圖圖層載入失敗。</b> 全國歷屆結果仍可正常使用。'}
}
init().catch(err=>{console.error(err);document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:auto 16px 16px;padding:12px 16px;background:#E4022B;color:#fff;border-radius:10px;font-weight:800">歷屆資料載入失敗，請稍後再試。</div>')});
</script>
</body>
</html>
