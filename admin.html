<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>後台管理 | 2026 全台選舉開箱圖鑑</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', '"Noto Sans TC"', 'sans-serif'] },
          colors: {
            canvas: '#F6F6F3',
            surface: '#FFFFFF',
            ink: { 900: '#141517', 700: '#3A3F45', 500: '#6E7681', 300: '#C9CED6', 100: '#EAECEE' },
            accent: { orange: '#FF5722', yellow: '#FFC837', lime: '#22C55E', blue: '#2563EB', red: '#E11D48' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>

  <style>
    .editorial-border { border: 1.5px solid #141517; }
    .card-brutal { border: 1.5px solid #141517; box-shadow: 4px 4px 0px #141517; }
    .select-editorial {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23141517' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 0.75rem center; background-size: 1rem;
    }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #C9CED6; border-radius: 4px; }
  </style>
</head>
<body class="bg-canvas text-ink-900 min-h-screen font-sans">

  <!-- 頂部導覽 -->
  <header class="h-16 sm:h-20 px-4 sm:px-10 bg-surface border-b editorial-border flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
      <div class="w-9 h-9 sm:w-10 sm:h-10 bg-ink-900 rounded-lg border editorial-border flex items-center justify-center shadow-[2px_2px_0px_#141517] shrink-0">
        <i data-lucide="shield" class="w-4 h-4 sm:w-5 sm:h-5 text-surface stroke-[2.5]"></i>
      </div>
      <div class="min-w-0">
        <span class="hidden sm:inline text-[11px] font-black uppercase tracking-wider text-accent-orange">Politics Design Lab</span>
        <h1 class="text-base sm:text-lg font-black tracking-tight text-ink-900 truncate">後台管理</h1>
      </div>
    </div>
    <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
      <a href="./index.html" title="回到地圖" class="text-xs font-bold text-ink-700 hover:text-ink-900 flex items-center space-x-1 p-2 sm:p-0 rounded-xl border editorial-border sm:border-0 shadow-[2px_2px_0px_#141517] sm:shadow-none">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">回到地圖</span>
      </a>
      <div id="user-box" class="hidden items-center space-x-2 bg-canvas border editorial-border rounded-xl px-2 sm:px-3 py-1.5 max-w-[45vw] sm:max-w-none">
        <img id="user-avatar" class="w-6 h-6 rounded-full border border-ink-900 shrink-0" src="" alt="">
        <span id="user-name" class="text-xs font-bold truncate"></span>
        <button onclick="doSignOut()" class="text-xs font-bold text-accent-orange hover:underline shrink-0">登出</button>
      </div>
    </div>
  </header>

  <!-- 尚未登入 -->
  <main id="gate" class="max-w-md mx-auto mt-24 px-6">
    <div class="bg-surface p-8 rounded-3xl border editorial-border shadow-[6px_6px_0px_#141517] text-center space-y-5">
      <div class="w-14 h-14 bg-canvas rounded-2xl border editorial-border flex items-center justify-center mx-auto">
        <i data-lucide="lock" class="w-7 h-7 text-ink-900"></i>
      </div>
      <div>
        <h2 class="text-xl font-black">管理者登入</h2>
        <p class="text-xs text-ink-500 font-medium mt-1.5 leading-relaxed">使用 Google 帳號登入以編輯候選人資料。</p>
      </div>
      <button onclick="doSignIn()" class="w-full inline-flex items-center justify-center space-x-2 py-3 rounded-xl bg-ink-900 text-surface text-sm font-bold hover:bg-accent-orange transition">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>使用 Google 登入</span>
      </button>
      <p id="gate-msg" class="text-xs font-bold"></p>
    </div>
  </main>

  <!-- 未授權提示 -->
  <main id="unauthorized" class="hidden max-w-md mx-auto mt-24 px-6">
    <div class="bg-surface p-8 rounded-3xl border editorial-border shadow-[6px_6px_0px_#141517] text-center space-y-4">
      <i data-lucide="shield-alert" class="w-10 h-10 text-accent-red mx-auto"></i>
      <h2 class="text-lg font-black">此帳號尚未取得管理權限</h2>
      <p class="text-xs text-ink-500 font-medium leading-relaxed">
        已使用 <span id="unauthorized-email" class="font-black text-ink-900"></span> 登入，但該信箱不在管理者名單中。
      </p>
      <button onclick="doSignOut()" class="text-xs font-bold text-accent-orange hover:underline">登出並切換帳號</button>
    </div>
  </main>

  <!-- 主編輯畫面 -->
  <main id="editor" class="hidden max-w-5xl mx-auto p-6 sm:p-10 space-y-6">

    <div class="bg-surface p-5 rounded-2xl border editorial-border shadow-[4px_4px_0px_#141517]">
      <h3 class="text-xs font-black uppercase tracking-wider text-ink-500 mb-3">選擇編輯範圍</h3>
      <div class="flex flex-wrap gap-2">
        <select id="a-select-city" class="select-editorial bg-canvas border editorial-border rounded-xl px-3.5 py-2 pr-8 text-xs font-bold cursor-pointer"><option value="">選擇縣市</option></select>
        <select id="a-select-district" disabled class="select-editorial bg-canvas border editorial-border rounded-xl px-3.5 py-2 pr-8 text-xs font-bold cursor-pointer disabled:opacity-40"><option value="">選擇鄉鎮市區</option></select>
        <select id="a-select-village" disabled class="select-editorial bg-canvas border editorial-border rounded-xl px-3.5 py-2 pr-8 text-xs font-bold cursor-pointer disabled:opacity-40"><option value="">選擇村里（可留空＝編輯鄉鎮市區層級）</option></select>
      </div>
    </div>

    <div id="edit-panel" class="hidden bg-surface p-5 sm:p-7 rounded-2xl border editorial-border shadow-[4px_4px_0px_#141517] space-y-6">
      
      <div class="flex items-center justify-between">
        <div>
          <span class="text-[10px] font-black uppercase tracking-wider text-accent-orange" id="edit-scope-tag">縣市層級</span>
          <h2 class="text-2xl font-black text-ink-900" id="edit-title">--</h2>
          <span class="text-[10px] font-bold text-ink-300" id="edit-code"></span>
        </div>
        <span id="save-status" class="text-xs font-bold"></span>
      </div>

      <!-- 縣市層級專用切換：首長 VS 議員 -->
      <div id="county-type-tabs" class="hidden flex items-center space-x-2 border-b border-ink-100 pb-3">
        <button type="button" id="tab-btn-mayor" onclick="switchCountyRole('mayor')" class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-ink-900 text-surface transition">
          縣市長選舉
        </button>
        <button type="button" id="tab-btn-councilor" onclick="switchCountyRole('councilor')" class="px-3.5 py-1.5 rounded-xl text-xs font-black bg-canvas border editorial-border text-ink-700 hover:bg-ink-100 transition">
          縣市議員選舉（依選舉區）
        </button>
      </div>

      <!-- 議員選舉區選擇列 -->
      <div id="council-district-box" class="hidden p-4 rounded-xl bg-canvas border editorial-border space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-black text-ink-700">選擇議員選舉區：</span>
            <select id="select-council-district" onchange="onCouncilDistrictChange()" class="select-editorial bg-surface border editorial-border rounded-xl px-3 py-1.5 pr-8 text-xs font-bold cursor-pointer"></select>
          </div>
          <button type="button" onclick="autoInit14Districts()" class="text-xs font-bold text-accent-blue hover:underline">
            + 重設 / 建立 1～14 選舉區
          </button>
        </div>
        <div id="single-district-quota-box" class="flex items-center space-x-2">
          <span class="text-[11px] font-bold text-ink-500">此選舉區應選席次：</span>
          <input id="f-district-quota" type="text" placeholder="例：12 席" onchange="updateDistrictQuota()" class="bg-surface border editorial-border rounded-lg px-2.5 py-1 text-xs font-bold w-36">
        </div>
      </div>

      <!-- 縣市人口與總席次 -->
      <div id="voters-quota-block" class="grid grid-cols-2 gap-3">
        <label class="block">
          <span class="text-[11px] font-bold text-ink-500 block mb-1 uppercase">選舉人口估計</span>
          <input id="f-voters" type="text" placeholder="例：約 2,042,300 人" class="w-full bg-canvas border editorial-border rounded-xl px-3 py-2 text-sm font-bold">
        </label>
        <label class="block">
          <span class="text-[11px] font-bold text-ink-500 block mb-1 uppercase">應選席次</span>
          <input id="f-quota" type="text" placeholder="例：市長 1 席 / 議員 63 席" class="w-full bg-canvas border editorial-border rounded-xl px-3 py-2 text-sm font-bold">
        </label>
      </div>

      <!-- 候選人編輯清單 -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-xs font-black uppercase tracking-wider text-ink-500" id="candidates-heading">候選人名冊</h3>
          <div class="flex items-center space-x-3">
            <button type="button" onclick="batchUpdateFromOfficial()" class="text-xs font-bold text-accent-orange hover:underline flex items-center space-x-1" title="自動將全選區 Wiki 照片換為議會圖並填入直達 FB">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i><span>替換 Wiki 照片與更新 FB（全區）</span>
            </button>
            <button type="button" onclick="addCandidateRow()" class="text-xs font-bold text-accent-blue hover:underline flex items-center space-x-1">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>新增候選人</span>
            </button>
          </div>
        </div>
        <div id="candidate-rows" class="space-y-3"></div>
      </div>

      <div class="flex items-center space-x-3 pt-2">
        <button onclick="saveOverride()" class="inline-flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-ink-900 text-surface text-xs font-bold hover:bg-accent-orange transition">
          <i data-lucide="save" class="w-4 h-4"></i><span>儲存修改</span>
        </button>
        <button onclick="resetOverride()" class="inline-flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-canvas border editorial-border text-xs font-bold hover:bg-ink-100 transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>還原為原始資料</span>
        </button>
      </div>
    </div>

    <div class="bg-surface p-5 rounded-2xl border editorial-border shadow-[4px_4px_0px_#141517]">
      <h3 class="text-xs font-black uppercase tracking-wider text-ink-500 mb-3 flex items-center space-x-2">
        <i data-lucide="history" class="w-3.5 h-3.5"></i><span>目前已有編輯紀錄（共 <span id="override-count">0</span> 筆）</span>
      </h3>
      <div id="override-list" class="space-y-1.5 text-xs"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAZdhEkMeCER-eh_De2viLi0jG2kD2f_4A",
      authDomain: "taiwan-election-map.firebaseapp.com",
      projectId: "taiwan-election-map",
      storageBucket: "taiwan-election-map.firebasestorage.app",
      messagingSenderId: "603857399918",
      appId: "1:603857399918:web:44fb7f95b20e127ad1b67f"
    };

    const firebaseConfigured = firebaseConfig.apiKey !== 'YOUR_API_KEY';
    const app = firebaseConfigured ? initializeApp(firebaseConfig) : null;
    const auth = firebaseConfigured ? getAuth(app) : null;
    const db = firebaseConfigured ? getFirestore(app) : null;
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let allOverrides = {};

    let countiesTopo = null;
    let townsCache = {};
    let villagesCache = {};
    let currentScope = null;
    let currentCountyRole = 'mayor'; // 'mayor' | 'councilor'
    let currentCode = null;
    let currentBase = null;

    let workingCandidates = [];
    let workingCouncilors = []; // [ { district: "1", quota: "12 席", candidates: [...] } ]
    let currentDistrictMode = 'all'; // 'all' 或 陣列 index (0 ~ 13)

    window.doSignIn = () => {
      signInWithRedirect(auth, provider).catch(err => {
        document.getElementById('gate-msg').textContent = '登入失敗：' + err.message;
      });
    };
    window.doSignOut = () => { signOut(auth); };

    if (firebaseConfigured) {
      getRedirectResult(auth).catch(err => console.error(err));
    }

    function topoToFeatures(topo) {
      const objKey = Object.keys(topo.objects)[0];
      return topojson.feature(topo, topo.objects[objKey]);
    }

    if (firebaseConfigured) {
      onAuthStateChanged(auth, async (user) => {
        const gate = document.getElementById('gate');
        const unauthorized = document.getElementById('unauthorized');
        const editor = document.getElementById('editor');
        const userBox = document.getElementById('user-box');

        if (!user) {
          currentUser = null;
          gate.classList.remove('hidden');
          unauthorized.classList.add('hidden');
          editor.classList.add('hidden');
          userBox.classList.add('hidden');
          return;
        }

        let authorized = false;
        try {
          const snap = await getDoc(doc(db, 'admins', user.email));
          authorized = snap.exists();
        } catch (err) {
          console.error('檢查管理權限失敗', err);
        }

        document.getElementById('user-avatar').src = user.photoURL || '';
        document.getElementById('user-name').textContent = user.displayName || user.email;
        userBox.classList.remove('hidden');
        userBox.classList.add('flex');

        if (!authorized) {
          currentUser = null;
          gate.classList.add('hidden');
          unauthorized.classList.remove('hidden');
          editor.classList.add('hidden');
          document.getElementById('unauthorized-email').textContent = user.email;
          return;
        }

        currentUser = user;
        gate.classList.add('hidden');
        unauthorized.classList.add('hidden');
        editor.classList.remove('hidden');
        await bootEditor();
      });
    }

    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('載入失敗: ' + url);
      return res.json();
    }

    async function bootEditor() {
      countiesTopo = await fetchJSON('./data/counties.json');

      const overrideSnap = await getDocs(collection(db, 'overrides'));
      allOverrides = {};
      overrideSnap.forEach(d => { allOverrides[d.id] = d.data(); });

      const selCity = document.getElementById('a-select-city');
      selCity.innerHTML = '<option value="">選擇縣市</option>';
      topoToFeatures(countiesTopo).features
        .slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.id;
          opt.textContent = `${f.properties.name} (${f.properties.category})`;
          selCity.appendChild(opt);
        });
      renderOverrideList();
      lucide.createIcons();
    }

    function renderOverrideList() {
      const list = document.getElementById('override-list');
      const ids = Object.keys(allOverrides);
      document.getElementById('override-count').textContent = ids.length;
      if (ids.length === 0) {
        list.innerHTML = '<p class="text-ink-500 font-medium">目前沒有任何後台編輯紀錄。</p>';
        return;
      }
      list.innerHTML = ids.map(id => `<div class="flex items-center justify-between px-3 py-2 bg-canvas rounded-lg border border-ink-100">
          <span class="font-bold">${id}</span>
          <span class="text-ink-500">${allOverrides[id].updatedBy || ''}</span>
        </div>`).join('');
    }

    // ---------- 三級聯動選單 ----------
    const selCity = document.getElementById('a-select-city');
    const selDistrict = document.getElementById('a-select-district');
    const selVillage = document.getElementById('a-select-village');

    selCity.addEventListener('change', async () => {
      selDistrict.innerHTML = '<option value="">選擇鄉鎮市區</option>';
      selVillage.innerHTML = '<option value="">選擇村里（可留空＝編輯鄉鎮市區層級）</option>';
      selVillage.disabled = true;
      const code = selCity.value;
      if (!code) { selDistrict.disabled = true; document.getElementById('edit-panel').classList.add('hidden'); return; }

      const feature = topoToFeatures(countiesTopo).features.find(f => f.properties.id === code);
      loadNode('county', feature, null, null);

      if (!townsCache[code]) townsCache[code] = await fetchJSON(`./data/towns/towns-${code}.json`);
      selDistrict.disabled = false;
      topoToFeatures(townsCache[code]).features
        .slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.id;
          opt.textContent = f.properties.name;
          selDistrict.appendChild(opt);
        });
    });

    selDistrict.addEventListener('change', async () => {
      selVillage.innerHTML = '<option value="">選擇村里（可留空＝編輯鄉鎮市區層級）</option>';
      const countyFeature = topoToFeatures(countiesTopo).features.find(f => f.properties.id === selCity.value);
      const code = selDistrict.value;
      if (!code) { selVillage.disabled = true; loadNode('county', countyFeature, null, null); return; }

      const townFeature = topoToFeatures(townsCache[selCity.value]).features.find(f => f.properties.id === code);
      loadNode('town', countyFeature, townFeature, null);

      if (!villagesCache[code]) villagesCache[code] = await fetchJSON(`./data/villages/villages-${code}.json`);
      selVillage.disabled = false;
      topoToFeatures(villagesCache[code]).features
        .slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name, 'zh-Hant'))
        .forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.properties.id;
          opt.textContent = f.properties.name;
          selVillage.appendChild(opt);
        });
    });

    selVillage.addEventListener('change', () => {
      const countyFeature = topoToFeatures(countiesTopo).features.find(f => f.properties.id === selCity.value);
      const townFeature = topoToFeatures(townsCache[selCity.value]).features.find(f => f.properties.id === selDistrict.value);
      if (!selVillage.value) { loadNode('town', countyFeature, townFeature, null); return; }
      const villFeature = topoToFeatures(villagesCache[selDistrict.value]).features.find(f => f.properties.id === selVillage.value);
      loadNode('village', countyFeature, townFeature, villFeature);
    });

    // ---------- 載入節點資料 ----------
    function loadNode(scope, countyFeature, townFeature, villFeature) {
      currentScope = scope;
      const feature = scope === 'county' ? countyFeature : (scope === 'town' ? townFeature : villFeature);
      currentCode = feature.properties.id;
      currentBase = feature.properties;
      const override = allOverrides[currentCode] || {};

      document.getElementById('edit-panel').classList.remove('hidden');
      const scopeTagText = scope === 'county' ? '縣市層級' : scope === 'town' ? '鄉鎮市區層級' : '村里層級';
      document.getElementById('edit-scope-tag').textContent = scopeTagText;
      const path = [countyFeature && countyFeature.properties.name, townFeature && townFeature.properties.name, villFeature && villFeature.properties.name]
        .filter(Boolean).join(' > ');
      document.getElementById('edit-title').textContent = path;
      document.getElementById('edit-code').textContent = '代碼：' + currentCode;
      document.getElementById('save-status').textContent = allOverrides[currentCode] ? '（此節點已有後台編輯覆寫）' : '';

      document.getElementById('voters-quota-block').classList.toggle('hidden', scope !== 'county');
      document.getElementById('f-voters').value = (override.voters !== undefined ? override.voters : currentBase.voters) || '';
      document.getElementById('f-quota').value = (override.quota !== undefined ? override.quota : currentBase.quota) || '';

      workingCandidates = JSON.parse(JSON.stringify(override.candidates !== undefined ? override.candidates : (currentBase.candidates || [])));
      
      // 支援 councilors 或 councilors.blocks 兩種資料結構相容
      const baseCouncilors = currentBase.councilors ? (currentBase.councilors.blocks || currentBase.councilors) : [];
      const overrideCouncilors = override.councilors ? (override.councilors.blocks || override.councilors) : null;
      workingCouncilors = JSON.parse(JSON.stringify(overrideCouncilors !== null ? overrideCouncilors : baseCouncilors));

      const isCounty = scope === 'county';
      document.getElementById('county-type-tabs').classList.toggle('hidden', !isCounty);

      if (isCounty) {
        switchCountyRole(currentCountyRole);
      } else {
        document.getElementById('council-district-box').classList.add('hidden');
        renderCandidateRows(workingCandidates);
      }
    }

    // ---------- 縣市切換：首長 VS 議員 ----------
    window.switchCountyRole = function(role) {
      currentCountyRole = role;
      const btnMayor = document.getElementById('tab-btn-mayor');
      const btnCouncilor = document.getElementById('tab-btn-councilor');
      const districtBox = document.getElementById('council-district-box');

      if (role === 'mayor') {
        btnMayor.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-ink-900 text-surface transition';
        btnCouncilor.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-canvas border editorial-border text-ink-700 hover:bg-ink-100 transition';
        districtBox.classList.add('hidden');
        document.getElementById('candidates-heading').textContent = '縣市長候選人名冊';
        renderCandidateRows(workingCandidates);
      } else {
        btnMayor.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-canvas border editorial-border text-ink-700 hover:bg-ink-100 transition';
        btnCouncilor.className = 'px-3.5 py-1.5 rounded-xl text-xs font-black bg-ink-900 text-surface transition';
        districtBox.classList.remove('hidden');
        document.getElementById('candidates-heading').textContent = '議員候選人名冊';

        if (!workingCouncilors || workingCouncilors.length === 0) {
          autoInit14Districts();
        } else {
          renderDistrictPicker();
        }
      }
      lucide.createIcons();
    };

    window.autoInit14Districts = function() {
      if (!workingCouncilors || workingCouncilors.length === 0) {
        workingCouncilors = [];
        for (let i = 1; i <= 14; i++) {
          workingCouncilors.push({
            district: String(i),
            quota: i === 1 ? '12 席' : (i === 7 ? '11 席' : '約 3~5 席'),
            candidates: []
          });
        }
      }
      currentDistrictMode = 'all';
      renderDistrictPicker();
    };

    // 渲染選區下拉選單（包含「全部選區」）
    function renderDistrictPicker() {
      const picker = document.getElementById('select-council-district');
      const totalCount = workingCouncilors.reduce((sum, b) => sum + (b.candidates ? b.candidates.length : 0), 0);
      
      let html = `<option value="all">🌟 全部選舉區（全覽共 ${totalCount} 位議員）</option>`;
      workingCouncilors.forEach((b, idx) => {
        html += `<option value="${idx}">第 ${b.district} 選舉區（已登記 ${b.candidates ? b.candidates.length : 0} 人）</option>`;
      });
      picker.innerHTML = html;
      picker.value = currentDistrictMode;
      onCouncilDistrictChange();
    }

    // 切換選區：全部 VS 單一選區
    window.onCouncilDistrictChange = function() {
      const picker = document.getElementById('select-council-district');
      currentDistrictMode = picker.value;
      const quotaBox = document.getElementById('single-district-quota-box');

      if (currentDistrictMode === 'all') {
        quotaBox.classList.add('hidden');
        document.getElementById('candidates-heading').textContent = `議員候選人名冊（全選區一覽）`;
        
        // 展平所有選區議員並標註 _district
        const allList = [];
        workingCouncilors.forEach(b => {
          (b.candidates || []).forEach(c => {
            allList.push({ ...c, _district: b.district });
          });
        });
        renderCandidateRows(allList, true);
      } else {
        const idx = parseInt(currentDistrictMode, 10) || 0;
        quotaBox.classList.remove('hidden');
        const block = workingCouncilors[idx];
        if (!block) return;
        document.getElementById('candidates-heading').textContent = `第 ${block.district} 選舉區議員名冊`;
        document.getElementById('f-district-quota').value = block.quota || '';
        renderCandidateRows(block.candidates || [], false);
      }
    };

    window.updateDistrictQuota = function() {
      if (currentDistrictMode !== 'all' && workingCouncilors[currentDistrictMode]) {
        workingCouncilors[currentDistrictMode].quota = document.getElementById('f-district-quota').value.trim();
      }
    };

    function renderCandidateRows(candidates, isAllView = false) {
      const wrap = document.getElementById('candidate-rows');
      wrap.innerHTML = '';
      candidates.forEach(c => addCandidateRow(c, isAllView));
      if (candidates.length === 0) addCandidateRow(null, isAllView);
      lucide.createIcons();
    }

    window.addCandidateRow = function(c, isAllView = false) {
      const defaultDistrict = (currentDistrictMode !== 'all' && workingCouncilors[currentDistrictMode]) 
        ? workingCouncilors[currentDistrictMode].district : '1';
      
      c = c || { 
        name: '', party: '無', role: currentCountyRole === 'councilor' ? '市議員候選人' : '候選人', 
        registeredDate: '', gazetteUrl: '', facebook: '', instagram: '', threads: '', youtube: '', photoUrl: '', 
        isIncumbent: false, _district: defaultDistrict 
      };

      const dist = c._district || c.district || defaultDistrict;

      const row = document.createElement('div');
      row.className = 'card-brutal bg-canvas rounded-xl p-3.5 space-y-2.5 relative';
      row.dataset.district = dist;

      const districtBadge = (currentCountyRole === 'councilor') ? `
        <div class="flex items-center space-x-1.5 mb-1">
          <span class="text-[10px] font-black uppercase px-2 py-0.5 rounded bg-ink-900 text-surface">第 ${escapeAttr(dist)} 選舉區</span>
        </div>
      ` : '';

      row.innerHTML = `
        ${districtBadge}
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 items-center">
          <input placeholder="姓名" class="c-name bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.name)}">
          <input placeholder="政黨" class="c-party bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.party)}">
          <input placeholder="職稱（如：市議員）" class="c-role bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.role)}">
          <div class="flex items-center gap-1.5">
            <input placeholder="選舉公報連結 (URL)" class="c-gazette flex-1 bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.gazetteUrl || '')}">
            <button type="button" onclick="this.closest('.card-brutal').remove()" class="text-accent-red hover:bg-accent-red/10 rounded-lg p-1.5 shrink-0">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <label class="flex items-center gap-1.5 text-xs font-bold text-ink-700 cursor-pointer w-fit">
          <input type="checkbox" class="c-incumbent w-4 h-4 accent-accent-orange cursor-pointer" ${c.isIncumbent ? 'checked' : ''}>
          <span>現任爭取連任</span>
        </label>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 items-center">
          <input placeholder="Facebook 直達連結" class="c-facebook bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.facebook || '')}">
          <input placeholder="Instagram 連結" class="c-instagram bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.instagram || '')}">
          <input placeholder="Threads 連結" class="c-threads bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.threads || '')}">
          <input placeholder="YouTube 連結" class="c-youtube bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.youtube || '')}">
        </div>
        <div class="flex items-center gap-1.5">
          <input placeholder="照片網址（右鍵複製圖片網址貼在此）" class="c-photourl flex-1 bg-surface border border-ink-300 rounded-lg px-2 py-1.5 text-xs font-bold" value="${escapeAttr(c.photoUrl || '')}">
          <div class="c-photopreview w-8 h-8 rounded-lg border border-ink-300 bg-surface shrink-0 overflow-hidden flex items-center justify-center">
            ${c.photoUrl ? `<img src="${escapeAttr(c.photoUrl)}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=&quot;text-accent-red text-[9px] font-bold&quot;>失敗</span>'">` : ''}
          </div>
        </div>
      `;
      document.getElementById('candidate-rows').appendChild(row);

      const photoInput = row.querySelector('.c-photourl');
      const photoPreview = row.querySelector('.c-photopreview');
      photoInput.addEventListener('change', () => {
        const url = photoInput.value.trim();
        photoPreview.innerHTML = url
          ? `<img src="${url}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<span class=&quot;text-accent-red text-[9px] font-bold&quot;>失敗</span>'">`
          : '';
      });
      lucide.createIcons();
    };

    function escapeAttr(s) {
      return (s || '').toString().replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function collectCandidatesFromForm() {
      return [...document.querySelectorAll('#candidate-rows > div')].map(row => ({
        name: row.querySelector('.c-name').value.trim(),
        party: row.querySelector('.c-party').value.trim() || '無',
        role: row.querySelector('.c-role').value.trim(),
        district: row.dataset.district || '1',
        registeredDate: '',
        gazetteUrl: row.querySelector('.c-gazette').value.trim() || null,
        facebook: row.querySelector('.c-facebook').value.trim() || null,
        instagram: row.querySelector('.c-instagram').value.trim() || null,
        threads: row.querySelector('.c-threads').value.trim() || null,
        youtube: row.querySelector('.c-youtube').value.trim() || null,
        photoUrl: row.querySelector('.c-photourl').value.trim() || null,
        isIncumbent: row.querySelector('.c-incumbent').checked,
      })).filter(c => c.name);
    }

    // ---------- 儲存至 Firebase ----------
    window.saveOverride = async function() {
      if (!currentUser || !currentCode) return;
      const status = document.getElementById('save-status');
      status.textContent = '儲存中…';

      if (currentScope === 'county') {
        if (currentCountyRole === 'mayor') {
          workingCandidates = collectCandidatesFromForm();
        } else {
          // 議員模式
          const formCandidates = collectCandidatesFromForm();
          if (currentDistrictMode === 'all') {
            // 全選區模式：依卡片上的 district 歸位至 workingCouncilors
            workingCouncilors.forEach(b => {
              b.candidates = formCandidates.filter(c => String(c.district) === String(b.district));
            });
          } else {
            // 單選區模式
            const idx = parseInt(currentDistrictMode, 10);
            if (workingCouncilors[idx]) {
              workingCouncilors[idx].candidates = formCandidates;
            }
          }
        }
      } else {
        workingCandidates = collectCandidatesFromForm();
      }

      const payload = {
        candidates: workingCandidates,
        updatedAt: new Date().toISOString(),
        updatedBy: currentUser.email,
      };

      if (currentScope === 'county') {
        payload.councilors = workingCouncilors; // 一併寫入 1~14 全選區
        payload.voters = document.getElementById('f-voters').value.trim() || null;
        payload.quota = document.getElementById('f-quota').value.trim() || null;
      }

      try {
        await setDoc(doc(db, 'overrides', currentCode), payload);
        allOverrides[currentCode] = payload;
        status.textContent = '已儲存 ✓';
        renderOverrideList();
        if (currentScope === 'county' && currentCountyRole === 'councilor') {
          renderDistrictPicker();
        }
      } catch (err) {
        status.textContent = '儲存失敗：' + err.message;
      }
    };

    window.resetOverride = async function() {
      if (!currentUser || !currentCode) return;
      if (!allOverrides[currentCode]) { document.getElementById('save-status').textContent = '（本來就沒有覆寫紀錄）'; return; }
      if (!confirm('確定要刪除此節點的後台編輯紀錄，還原為原始資料嗎？')) return;
      try {
        await deleteDoc(doc(db, 'overrides', currentCode));
        delete allOverrides[currentCode];
        document.getElementById('save-status').textContent = '已還原為原始資料';
        renderOverrideList();
        selCity.dispatchEvent(new Event('change'));
      } catch (err) {
        document.getElementById('save-status').textContent = '還原失敗：' + err.message;
      }
    };

    // ---------- 批次替換 Wiki 照片並更新 FB（全選區一次完成） ----------
    window.batchUpdateFromOfficial = async function() {
      const status = document.getElementById('save-status');
      status.textContent = '讀取議會資料中…';

      async function applyData(list) {
        if (!workingCouncilors || workingCouncilors.length === 0) {
          autoInit14Districts();
        }

        const map = new Map();
        list.forEach(c => {
          if (c && c.name) map.set(c.name.replace(/[\s\u3000]/g, ''), c);
        });

        let photoCount = 0;
        let fbCount = 0;
        let addedCount = 0;

        // 1. 全局掃描 workingCouncilors 的所有選區
        const handledNames = new Set();

        workingCouncilors.forEach(block => {
          if (!block.candidates) block.candidates = [];
          block.candidates.forEach(c => {
            const cleanName = c.name.replace(/[\s\u3000]/g, '');
            const target = map.get(cleanName);
            if (target) {
              handledNames.add(cleanName);
              const curPhoto = (c.photoUrl || '').toLowerCase();
              if (!curPhoto || curPhoto.includes('wikipedia.org') || curPhoto.includes('wikimedia.org')) {
                if (target.photoUrl) {
                  c.photoUrl = target.photoUrl;
                  photoCount++;
                }
              }
              if (target.facebook && (!c.facebook || c.facebook.includes('facebook.com/search'))) {
                c.facebook = target.facebook;
                fbCount++;
              }
            }
          });
        });

        // 2. 若有爬到的議員未存在於任何選區中，自動依選區補入
        list.forEach(item => {
          const cleanName = item.name.replace(/[\s\u3000]/g, '');
          if (!handledNames.has(cleanName)) {
            const targetDist = String(item.district || '1');
            let block = workingCouncilors.find(b => String(b.district) === targetDist);
            if (!block && workingCouncilors.length > 0) block = workingCouncilors[0];

            if (block) {
              block.candidates.push({
                name: item.name,
                party: item.party || '無',
                role: '市議員候選人',
                photoUrl: item.photoUrl || '',
                facebook: item.facebook || '',
                isIncumbent: true
              });
              addedCount++;
              handledNames.add(cleanName);
            }
          }
        });

        // 3. 重新渲染畫面（直接切換至全選區檢視）
        currentDistrictMode = 'all';
        renderDistrictPicker();

        status.textContent = `全選區更新完成：替換 ${photoCount} 張官方照片，更新 ${fbCount} 個直達 FB。`;
        alert(`🎉 全選區批次同步完成！\n\n- 替換維基百科照片：${photoCount} 位\n- 更新直達官方粉專：${fbCount} 位\n- 自動歸位補齊名單：${addedCount} 位\n\n已自動切換為「全部選舉區」檢視，請確認後點擊「儲存修改」一次寫入後台！`);
      }

      try {
        const res = await fetch('./data/tycc_councilors.json');
        if (!res.ok) throw new Error('找不到 ./data/tycc_councilors.json');
        const data = await res.json();
        await applyData(data);
      } catch (err) {
        // 備援：手動選取 tycc_councilors.json
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.json';
        fileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async (evt) => {
            try {
              const data = JSON.parse(evt.target.result);
              await applyData(data);
            } catch (je) {
              alert('JSON 格式解析錯誤');
            }
          };
          reader.readAsText(file);
        };
        fileInput.click();
      }
    };

    lucide.createIcons();
  </script>
</body>
</html>
