name = "election-api"
main = "worker.js"
compatibility_date = "2026-09-16"
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://formosaobservatory.com,https://www.formosaobservatory.com,https://taiwan-election-map.uprisevideoproduction.workers.dev"
ADMIN_REDIRECT_URL = "https://formosaobservatory.com/admin.html"
ENABLE_CF_ACCESS_AUTH = "true"
# Only this Access-authenticated account may use the admin API.
ADMIN_EMAILS = "Uprisevideoproduction@gmail.com"

# ── 強烈建議啟用：讓 Worker 驗證 Cloudflare Access 簽發的 JWT（防止偽造 email header）──
# Zero Trust → Access → Applications → 你的 Application → 複製 "Application Audience (AUD) Tag"
# Team domain 在 Zero Trust → Settings → Custom Pages 可看到（xxxx.cloudflareaccess.com）
# 填好後取消註解並重新部署：
CF_ACCESS_TEAM_DOMAIN = "damp-river-0d95.cloudflareaccess.com"
CF_ACCESS_AUD = "11bb1fe1d2f8439e9b4a124268256443d83cb558f144e7a13df79a4ff8e43b84"

[observability]
enabled = true

[observability.logs]
enabled = true

[[kv_namespaces]]
binding = "ELECTION_KV"
id = "f667c7a8748e48089998150bf83ce550"
