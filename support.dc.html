<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>資料支援與配置 - 2026 年選舉</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 text-white font-bold text-lg hover:text-emerald-400 transition">
        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
        <span>2026 選舉觀測站</span>
      </a>
      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="index.html" class="text-slate-300 hover:text-white transition">首頁倒數</a>
        <a href="observatory.dc.html" class="text-slate-300 hover:text-white transition">席次觀測</a>
        <a href="support.dc.html" class="text-emerald-400">資料支援</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
    <h1 class="text-2xl md:text-3xl font-bold mb-4">選區與應選名額支援資料</h1>
    <p class="text-slate-400 text-sm mb-8">本頁整合各選區鄉鎮市區對照及名額配額資訊。</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4 text-emerald-400">選區配額概覽</h2>
        <div id="quotaContainer" class="text-sm text-slate-300 space-y-2">
          載入配額資料中...
        </div>
      </div>

      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4 text-emerald-400">選區鄉鎮對照</h2>
        <div id="townMapContainer" class="text-sm text-slate-300 space-y-2">
          載入鄉鎮對照中...
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    2026 選舉倒數資訊平台 · 資料以選委會官方公告為準
  </footer>

  <script src="support.js"></script>
</body>
</html>
