name: Build presidential history data

on:
  push:
    branches:
      - feature/historical-election-map-20260922
    paths:
      - scripts/build-presidential-history.mjs
      - scripts/patch-history-nav.mjs
      - data/history/presidential.json
      - .github/workflows/build-presidential-history.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/historical-election-map-20260922
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect 1996 county summary shape
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, urllib.parse, urllib.request
          folder='1996_第09任總統（副總統）選舉'
          url='https://raw.githubusercontent.com/MISNUK/CECDataSet/master/data/'+urllib.parse.quote(folder)+'/VoteRecords.csv'
          text=urllib.request.urlopen(url).read().decode('utf-8-sig')
          rows=list(csv.DictReader(io.StringIO(text)))
          matches=[]
          for r in rows:
              if (r.get('CountyCityName') or '').strip() and not (r.get('TownshipName') or '').strip() and not (r.get('VillageName') or '').strip() and str(r.get('PollStationNo') or '').strip() in ('','0'):
                  matches.append(r)
              if len(matches)>=16: break
          print('columns=', list(rows[0].keys()) if rows else [])
          for r in matches: print({k:r.get(k) for k in ('CountyCityName','TownshipName','VillageName','PollStationNo','DistrictName','DrawNo','VoteCounts','CandIdateName','EndorsementPartyName')})
          PY

      - name: Build and validate county results
        run: node scripts/build-presidential-history.mjs

      - name: Add history navigation entry
        run: node scripts/patch-history-nav.mjs

      - name: Commit generated history data
        shell: bash
        run: |
          if git diff --quiet -- data/history/presidential-counties.json index.html; then
            echo "Historical data and navigation are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/presidential-counties.json index.html
          git commit -m "data: build verified presidential county results"
          git push origin HEAD:feature/historical-election-map-20260922
