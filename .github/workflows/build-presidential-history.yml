name: Build presidential history data

on:
  push:
    branches:
      - feature/historical-election-map-20260922
    paths:
      - scripts/build-presidential-history.mjs
      - scripts/append-modern-presidential-history.mjs
      - scripts/build-modern-presidential-towns.mjs
      - scripts/patch-history-nav.mjs
      - scripts/patch-history-drilldown.mjs
      - scripts/patch-history-product-ui.mjs
      - history/product-ui.css
      - history/product-ui.js
      - history/archive-enhancements.css
      - history/archive-enhancements.js
      - data/history/presidential.json
      - .github/workflows/build-presidential-history.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: presidential-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/historical-election-map-20260922
          fetch-depth: 0

      - name: Checkout 2024 CEC raw-data mirror
        uses: actions/checkout@v4
        with:
          repository: kiang/db.cec.gov.tw
          ref: master
          path: .history-sources/cec
          sparse-checkout: |
            voteData/2024總統立委/總統/elbase.csv
            voteData/2024總統立委/總統/elctks.csv
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download processed 2020 results
        shell: bash
        run: |
          mkdir -p .history-sources/2020
          curl -L --fail --retry 3 \
            https://github.com/everdark/TW_Presidential_Election_2020/releases/download/0.4/presidential.zip \
            -o /tmp/presidential-2020.zip
          unzip -q -o /tmp/presidential-2020.zip -d .history-sources/2020
          test -f .history-sources/2020/presidential_counties.csv
          test -f .history-sources/2020/presidential_regions.csv

      - name: Build and validate 1996–2016 county results
        run: node scripts/build-presidential-history.mjs

      - name: Append and validate 2020–2024 county results
        run: node scripts/append-modern-presidential-history.mjs

      - name: Build and validate 2020–2024 township results
        run: node scripts/build-modern-presidential-towns.mjs

      - name: Add history navigation entry
        run: node scripts/patch-history-nav.mjs

      - name: Add township drilldown entry
        run: node scripts/patch-history-drilldown.mjs

      - name: Wire shared history product UI
        run: node scripts/patch-history-product-ui.mjs

      - name: Commit generated history data and page wiring
        shell: bash
        run: |
          if git diff --quiet -- data/history/presidential-counties.json data/history/presidential-towns.json index.html history/index.html history/town.html; then
            echo "Historical data and UI wiring are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/presidential-counties.json data/history/presidential-towns.json index.html history/index.html history/town.html
          git commit -m "data: build verified presidential history results"
          git push origin HEAD:feature/historical-election-map-20260922
