name: Validate previous election results UI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/validate-prev-results-ui.mjs'
      - '.github/workflows/validate-prev-results-ui.yml'
  workflow_dispatch:

jobs:
  prev-results-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate previous election section at 390px
        run: node scripts/validate-prev-results-ui.mjs
      - name: Upload previous election screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prev-results-ui
          path: artifacts/prev-results-ui/
          if-no-files-found: ignore
