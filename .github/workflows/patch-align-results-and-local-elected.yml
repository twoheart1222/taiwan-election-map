name: Patch result alignment and local elected style

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch-align-results-and-local-elected.mjs'
      - '.github/workflows/patch-align-results-and-local-elected.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: node scripts/patch-align-results-and-local-elected.mjs
      - name: Validate patch markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const index = fs.readFileSync('index.html','utf8');
          const css = fs.readFileSync('history/local-executive.css','utf8');
          const checks = [
            [index, "'padding:9px 12px;border-top:1px solid #2a2723'", 'aligned non-winner padding'],
            [css, ".local-candidate.elected{border-color:#5b5147}", 'elected border'],
            [css, ".local-candidate.elected:before{content:'當選'", 'yellow elected badge'],
            [css, 'background:var(--yellow);color:#0d0d0d', 'president badge colors']
          ];
          for (const [text, marker, label] of checks) if (!text.includes(marker)) throw new Error(`Missing ${label}: ${marker}`);
          if (css.includes("content:'當選 / ELECTED'")) throw new Error('Old local elected stamp still present');
          console.log('Patch markers validated.');
          NODE
      - name: Commit production changes
        run: |
          if git diff --quiet -- index.html history/local-executive.css; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html history/local-executive.css
          git commit -m 'Align result rows and unify elected styling'
          git push origin HEAD:main
