name: Apply Taichung official Facebook and photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-taichung-official-social-photo.yml'
      - 'scripts/apply-taichung-official-social-photo.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply official Facebook and photos
        run: node scripts/apply-taichung-official-social-photo.mjs
      - name: Report remaining missing Facebook and photo
        run: node scripts/report-missing-councilor-social-photo.mjs 66000
      - name: Commit data update
        run: |
          if git diff --quiet -- data/counties.json; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/counties.json
          git commit -m 'Add verified Taichung councilor Facebook links and photos [skip ci]'
          git push
