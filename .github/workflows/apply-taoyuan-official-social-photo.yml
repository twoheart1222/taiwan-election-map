name: Apply Taoyuan official Facebook and photo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-taoyuan-official-social-photo.yml'
      - 'scripts/apply-taoyuan-official-social-photo.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Apply official Facebook and photos
        run: node scripts/apply-taoyuan-official-social-photo.mjs
      - name: Report remaining missing Facebook and photo
        run: node scripts/report-missing-councilor-social-photo.mjs 68000
      - name: Commit data update
        run: |
          if git diff --quiet -- data/counties.json; then
            echo 'No data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/counties.json
          git commit -m 'Add verified Taoyuan councilor Facebook links and photos [skip ci]'
          git push
