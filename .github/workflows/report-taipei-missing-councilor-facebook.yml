name: Report Taipei missing councilor Facebook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/report-taipei-missing-councilor-facebook.yml'
      - 'scripts/report-missing-councilor-facebook.mjs'
      - 'data/counties.json'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Report Taipei missing Facebook
        run: node scripts/report-missing-councilor-facebook.mjs 63000
