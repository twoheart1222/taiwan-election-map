name: Patch admin KV social sync

on:
  push:
    branches: [main]
    paths:
      - 'admin-kv-sync.js'
      - 'scripts/patch-admin-kv-social-sync.mjs'
      - '.github/workflows/patch-admin-kv-social-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mount KV social sync in admin
        run: node scripts/patch-admin-kv-social-sync.mjs
      - name: Validate mount
        run: |
          grep -q '<script src="./admin-kv-sync.js"></script>' admin.html
      - name: Commit admin update
        run: |
          if git diff --quiet -- admin.html; then
            echo "No admin.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Mount safe GitHub to KV social sync in admin"
          git push origin HEAD:main
