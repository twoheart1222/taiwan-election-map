name: Patch results panel scroll clipping

on:
  push:
    branches:
      - feature/historical-election-map-20260922
    paths:
      - scripts/patch-results-panel-scroll.mjs
      - .github/workflows/patch-results-panel-scroll.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch results panel
        run: node scripts/patch-results-panel-scroll.mjs
      - name: Validate patch markers
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const marker of [
            'class="results-kicker"',
            'overflow-anchor:none',
            "const resetResultScroll = () =>",
            "if (scrollShell) scrollShell.scrollTop = 0"
          ]) {
            if (!html.includes(marker)) throw new Error(`Missing marker: ${marker}`);
          }
          console.log('Results panel clipping patch markers validated.');
          NODE
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix mobile results heading clipping [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
