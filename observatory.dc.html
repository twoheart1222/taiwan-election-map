<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>席次觀測站 - 2026 年選舉</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 text-white font-bold text-lg hover:text-emerald-400 transition">
        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
        <span>2026 選舉觀測站</span>
      </a>
      <nav class="flex items-center space-x-6 text-sm font-medium">
        <a href="index.html" class="text-slate-300 hover:text-white transition">首頁倒數</a>
        <a href="observatory.dc.html" class="text-emerald-400">席次觀測</a>
        <a href="support.dc.html" class="text-slate-300 hover:text-white transition">資料支援</a>
      </nav>
    </div>
  </header>

  <main class="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
    <h1 class="text-2xl md:text-3xl font-bold mb-6">各縣市選情與席次觀測</h1>
    
    <div class="mb-6 flex gap-4 items-center">
      <label for="countySelect" class="text-sm text-slate-400">選擇縣市：</label>
      <select id="countySelect" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500">
        <option value="">載入中...</option>
      </select>
    </div>

    <div id="contentArea" class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 min-h-[300px]">
      <p class="text-slate-400 text-center py-12">請選擇縣市檢視各選區分配資料</p>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    2026 選舉倒數資訊平台 · 資料以選委會官方公告為準
  </footer>

  <script>
    // 使用相對路徑載入 JSON
    async function loadCounties() {
      try {
        const res = await fetch('data/counties.json');
        const counties = await res.json();
        const select = document.getElementById('countySelect');
        select.innerHTML = '<option value="">請選擇縣市</option>';
        counties.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id || c.name;
          opt.textContent = c.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('無法讀取 counties.json', err);
      }
    }
    loadCounties();
  </script>
</body>
</html>
